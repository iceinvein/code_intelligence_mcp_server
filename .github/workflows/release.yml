name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-check:
    name: Validate tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check versions match tag
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_REF#v}"
          CARGO_VERSION=$(sed -n '3s/^version = "\(.*\)"/\1/p' Cargo.toml)
          NPM_VERSION=$(node -p "require('./npm/package.json').version")
          BREW_VERSION=$(sed -nE 's/^[[:space:]]*version "(.*)"$/\1/p' dist/homebrew/code-intelligence-mcp.rb | head -1)

          echo "Tag version:           $TAG_VERSION"
          echo "Cargo.toml:            $CARGO_VERSION"
          echo "npm/package.json:      $NPM_VERSION"
          echo "brew formula:          $BREW_VERSION"

          FAILED=0
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$NPM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::npm/package.json version ($NPM_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$BREW_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::dist/homebrew/code-intelligence-mcp.rb version ($BREW_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Run ./scripts/release.sh $TAG_VERSION to update all version files before tagging."
            exit 1
          fi

          echo "All versions match tag v$TAG_VERSION"

  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for CI to pass on this commit
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc  # v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Rust gates (macOS)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20

  build:
    name: Build (macOS Silicon)
    needs: [version-check, wait-for-ci]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workflow-cache-macos"

      - name: Install Protoc
        run: brew install protobuf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web Portal
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Assert UI built
        run: |
          test -f ui/dist/index.html || { echo "::error::ui/dist/index.html missing; web portal did not build"; exit 1; }

      - name: Build Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Archive Binary Bundle
        shell: bash
        run: |
          mkdir -p bundle/producers
          cp target/aarch64-apple-darwin/release/code-intelligence-mcp-server bundle/
          ln -s code-intelligence-mcp-server bundle/code-intel
          cp producers/manifest.json bundle/producers/manifest.json
          cp producers/bin/code-intelligence-external-* bundle/
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const manifest = JSON.parse(fs.readFileSync("producers/manifest.json", "utf8"));
          const supportFiles = new Set();

          for (const producer of manifest.producers || []) {
            for (const supportFile of producer.support_files || []) {
              supportFiles.add(supportFile);
            }
          }

          for (const supportFile of supportFiles) {
            const parts = supportFile.split("/");
            if (
              path.isAbsolute(supportFile) ||
              parts.includes("") ||
              parts.includes("..")
            ) {
              throw new Error(`Invalid producer support file path: ${supportFile}`);
            }

            const source = path.join(...parts);
            const destination = path.join("bundle", ...parts);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(source, destination);
          }
          NODE
          chmod 755 bundle/code-intelligence-mcp-server bundle/code-intelligence-external-*
          tar czf code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz -C bundle .

      - name: Compute tarball SHA256
        id: sha
        shell: bash
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TARBALL=code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          printf '%s  %s\n' "$SHA" "$TARBALL" > "$TARBALL.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Homebrew formula update for $TAG_REF"
            echo
            echo 'Bump `dist/homebrew/code-intelligence-mcp.rb` (and the copy in '
            echo '`iceinvein/homebrew-tap`) to:'
            echo
            echo '```ruby'
            echo "version \"${TAG_REF#v}\""
            echo "sha256 \"$SHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz
            code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz.sha256
          generate_release_notes: true

  npm-publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Copy README to npm package
        run: cp README.md npm/README.md

      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public

      # NOTE: The legacy `@iceinvein/code-intelligence-mcp-standalone`
      # package is intentionally not republished. It was a v3-era split
      # for standalone-vs-stdio installs, which is no longer a meaningful
      # distinction in v4. The npm-standalone/ tree stays in this repo
      # at v3.3.0 for archive purposes; run `npm unpublish` manually
      # after v4.0 lands on npm and brew.
