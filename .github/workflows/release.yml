name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (macOS Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workflow-cache-macos"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Archive Binary
        shell: bash
        run: |
          cd target/aarch64-apple-darwin/release
          tar czf ../../../code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz code-intelligence-mcp-server

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz
          generate_release_notes: true

  npm-publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Copy README to npm package
        run: cp README.md npm/README.md

      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
