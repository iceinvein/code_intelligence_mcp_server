name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (macOS Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workflow-cache-aarch64-apple-darwin"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Archive Binary
        shell: bash
        run: |
          cd target/aarch64-apple-darwin/release
          tar czf ../../../code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz code-intelligence-mcp-server

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz
