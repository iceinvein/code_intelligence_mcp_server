name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-check:
    name: Validate tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n '3s/^version = "\(.*\)"/\1/p' Cargo.toml)
          NPM_VERSION=$(node -p "require('./npm/package.json').version")
          NPM_STANDALONE_VERSION=$(node -p "require('./npm-standalone/package.json').version")

          echo "Tag version:           $TAG_VERSION"
          echo "Cargo.toml:            $CARGO_VERSION"
          echo "npm/package.json:      $NPM_VERSION"
          echo "npm-standalone:        $NPM_STANDALONE_VERSION"

          FAILED=0
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$NPM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::npm/package.json version ($NPM_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$NPM_STANDALONE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::npm-standalone/package.json version ($NPM_STANDALONE_VERSION) does not match tag ($TAG_VERSION)"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Run ./scripts/release.sh $TAG_VERSION to update all version files before tagging."
            exit 1
          fi

          echo "All versions match tag v$TAG_VERSION"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (macOS Silicon)
    needs: [version-check, ci]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workflow-cache-macos"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Archive Binary
        shell: bash
        run: |
          cd target/aarch64-apple-darwin/release
          tar czf ../../../code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz code-intelligence-mcp-server

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: code-intelligence-mcp-server-aarch64-apple-darwin.tar.gz
          generate_release_notes: true

  npm-publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Copy README to npm package
        run: cp README.md npm/README.md

      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public

      - name: Copy README to standalone package
        run: cp README.md npm-standalone/README.md

      - name: Publish standalone to npm
        working-directory: npm-standalone
        run: npm publish --provenance --access public
