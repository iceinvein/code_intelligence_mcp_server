[package]
name = "code-intelligence-mcp-server"
version = "4.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
rust-mcp-sdk = { version = "0.8.1", features = ["macros", "server", "stdio", "hyper-server", "streamable-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = { version = "2", features = ["serde"] }
tree-sitter = "0.25.0"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23.2"
rusqlite = { version = "0.33", features = ["bundled"] }
tantivy = "0.25.0"
lancedb = "0.23.1"
arrow-array = "56"
arrow-schema = "56"
futures = "0.3"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-swift = "0.7.1"

# Phase 1 Foundation dependencies
lazy_static = "1.4"
lru = "0.12"
num_cpus = "1"
once_cell = "1"
postcard = { version = "1.1", features = ["use-std"] }
prometheus = "0.13"
sha2 = "0.10"
rayon = "1"
tiktoken-rs = "0.7"
libc = "0.2"


# Phase 3 HyDE dependencies (03-03) - LLM API client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Phase 9 Multi-repo dependencies
git2 = "0.19"
toml = "0.8"
regex = "1"

# Phase 14 Path Reliability dependencies (14-01)
camino = { version = "1.1", features = ["serde1"] }
dunce = "1.0"

# Background worker utilities
tokio-util = { version = "0.7", features = ["rt"] }

# OS-native file watching (FSEvents on macOS)
notify = "8"

# LLM model auto-download from HuggingFace
hf-hub = "0.3"

# LLM inference via llama.cpp with Metal GPU acceleration
llama-cpp-2 = { version = "0.1", features = ["metal"] }

# Cross-platform flock() for leader election
fs2 = "0.4"

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
tempfile = "3"
rstest = "0.24"
test-case = "3"
proptest = "1"
filetime = "0.2"
portpicker = "0.1"
