  - id: django-negative-01
    task_type: negative
    difficulty: medium
    question: "Does Django ship a built-in WebSocket handler? Can `ASGIHandler` accept WebSocket connections out of the box?"
    rubric: |
      Must conclude that Django does NOT support WebSocket connections natively.
      ASGIHandler.__call__ (django/core/handlers/asgi.py, line 150) explicitly
      checks scope["type"] != "http" and raises ValueError with the message
      "Django can only handle ASGI/HTTP connections, not %s." WebSocket requires
      scope["type"] == "websocket" which is rejected. Django Channels (a separate
      third-party package) is needed for WebSocket support.
      Penalize: claiming ASGIHandler supports WebSocket, or citing any file in
      django/core/handlers/ that handles WebSocket connections.
    expected:
      citations:
        - { file: "django/core/handlers/asgi.py", line_range: [150, 163], symbol: "ASGIHandler" }
      files:
        - "django/core/handlers/asgi.py"
      facts:
        - ["does not support", "not supported", "raises ValueError", "Django can only handle"]
        - ["Channels", "third-party", "websocket rejected"]
      forbidden:
        - "ASGIHandler handles websocket"
        - "WebSocketHandler"
        - "websocket support built-in"
      forbidden_strict: true

  - id: django-negative-02
    task_type: negative
    difficulty: easy
    question: "Does Django include a built-in JWT authentication backend? Is there a `JWTAuthentication` class or any JWT token issuance in `django.contrib.auth`?"
    rubric: |
      Must conclude that Django does NOT include any JWT authentication support.
      There is no JWTAuthentication class, no JWT token generation, and no
      jwt import anywhere in django.contrib.auth or django.contrib. Django's
      built-in auth uses session-based authentication (django.contrib.sessions)
      and provides a token auth model in django.contrib.auth.models (Token is a
      simple DB token, not JWT). JWT support requires a third-party package such
      as djangorestframework-simplejwt or PyJWT.
      Penalize: citing django/contrib/auth/tokens.py (which implements
      password-reset tokens, not JWT), or claiming any built-in JWT class exists.
    expected:
      citations: []
      files: []
      facts:
        - ["does not exist", "no JWT", "not built-in", "third-party"]
        - ["session", "Token model", "password-reset"]
      # PyJWT is deliberately NOT forbidden: the rubric names it as the
      # expected third-party pointer, so forbidding it contradicts the rubric.
      forbidden:
        - "JWTAuthentication"
        - "jwt.encode"
      forbidden_strict: true
