  - id: django-symbol-01
    task_type: symbol_lookup
    difficulty: easy
    question: "Where is the `Model` class defined in Django? Give the file path and line."
    rubric: |
      Must cite django/db/models/base.py at line 459. Correct answer identifies
      Model as a class with metaclass=ModelBase that also inherits from AltersData.
      The metaclass (ModelBase, line 92) handles field registration and contributes
      to class setup; the student must distinguish Model from ModelBase.
      Bonus: notes the AltersData mixin and the ModelBase metaclass in the same file.
      Penalize: citing ModelBase (line 92) as the primary answer instead of Model,
      or citing django/db/models/__init__.py (the re-export barrel) as the definition
      site.
    expected:
      citations:
        - { file: "django/db/models/base.py", line_range: [459, 530], symbol: "Model" }
      files:
        - "django/db/models/base.py"
      facts:
        - "Model"
        - ["metaclass=ModelBase", "ModelBase"]
        - ["AltersData", "base.py"]
      forbidden:
        - "django/db/models/__init__.py"
      forbidden_strict: false

  - id: django-symbol-02
    task_type: symbol_lookup
    difficulty: easy
    question: "Where is the `QuerySet` class defined? Give the file path and line."
    rubric: |
      Must cite django/db/models/query.py at line 293. Correct answer identifies
      QuerySet as a class inheriting from AltersData that provides lazy evaluation
      via _result_cache. The __init__ sets up self._query = sql.Query(self.model),
      which is the underlying SQL query object.
      Bonus: notes _result_cache for lazy evaluation and the AltersData parent class.
      Penalize: citing django/db/models/__init__.py (barrel re-export) or
      django/db/models/manager.py (which creates QuerySets but does not define
      the class).
    expected:
      citations:
        - { file: "django/db/models/query.py", line_range: [293, 320], symbol: "QuerySet" }
      files:
        - "django/db/models/query.py"
      facts:
        - "QuerySet"
        - ["AltersData", "lazy"]
        - ["_result_cache", "sql.Query"]
      forbidden:
        - "django/db/models/__init__.py"
        - "django/db/models/manager.py"
      forbidden_strict: false

  - id: django-symbol-03
    task_type: symbol_lookup
    difficulty: easy
    question: "Where is `get_user_model` defined? Give the file path and line."
    rubric: |
      Must cite django/contrib/auth/__init__.py at line 183. Correct answer
      identifies it as a function that calls django_apps.get_model using the
      AUTH_USER_MODEL setting. It raises ImproperlyConfigured for bad settings
      or uninstalled models.
      Bonus: notes require_ready=False is passed to allow use before app registry
      is fully populated.
      Penalize: citing django/contrib/auth/models.py (where the default User model
      lives) or any other file.
    expected:
      citations:
        - { file: "django/contrib/auth/__init__.py", line_range: [183, 197], symbol: "get_user_model" }
      files:
        - "django/contrib/auth/__init__.py"
      facts:
        - "get_user_model"
        - ["AUTH_USER_MODEL", "get_model"]
        - ["ImproperlyConfigured", "require_ready"]
      forbidden:
        - "django/contrib/auth/models.py"
      forbidden_strict: false

  - id: django-symbol-04
    task_type: symbol_lookup
    difficulty: medium
    question: "Where are `URLPattern` and `URLResolver` defined? Give file paths and lines."
    rubric: |
      Both classes are defined in django/urls/resolvers.py: URLPattern at line 412
      and URLResolver at line 493. URLPattern wraps a single route pattern and its
      callback view; URLResolver wraps a group of patterns and handles namespace
      traversal.
      Bonus: notes URLPattern.resolve (line 461) does a direct pattern match and
      returns a ResolverMatch, while URLResolver.resolve (line 660) iterates nested
      patterns recursively.
      Penalize: citing django/urls/__init__.py (the re-export) as the definition
      site, or conflating URLPattern with URLResolver (they are distinct classes
      in the same file).
    expected:
      citations:
        - { file: "django/urls/resolvers.py", line_range: [412, 491], symbol: "URLPattern" }
        - { file: "django/urls/resolvers.py", line_range: [493, 660], symbol: "URLResolver" }
      files:
        - "django/urls/resolvers.py"
      facts:
        - "URLPattern"
        - "URLResolver"
        - ["resolvers.py", "line 412", "line 493"]
      forbidden:
        - "django/urls/__init__.py"
      forbidden_strict: false

  # ---------------------------------------------------------------------------
