  - id: django-impact-01
    task_type: impact
    difficulty: medium
    question: "If `BaseCommand.execute()` in `django/core/management/base.py` were changed to add a required keyword argument, which subclasses or call sites would need updating?"
    rubric: |
      Call sites of BaseCommand.execute():
        - django/core/management/__init__.py (line 194): calls command.execute()
          in call_command().
        - django/core/management/base.py (line 413): run_from_argv calls
          self.execute() directly.
        - django/core/management/commands/runserver.py (line 75): overrides execute
          and calls super().execute().
        - django/core/management/commands/sqlmigrate.py (line 39): overrides execute
          and calls super().execute().
      Subclasses that override execute() would need to accept and forward the new
      argument; call sites in __init__.py and base.py must also pass it.
      Bonus: notes that AppCommand and LabelCommand (base.py, lines 616 and 661)
      do NOT override execute, so only their indirectly-affected call sites matter.
      Penalize: listing only one or two call sites and claiming no other files are
      affected, or missing the runserver and sqlmigrate overrides.
    expected:
      citations:
        - { file: "django/core/management/base.py", line_range: [432, 469], symbol: "execute" }
        - { file: "django/core/management/__init__.py", line_range: [194, 194], symbol: "call_command" }
        - { file: "django/core/management/commands/runserver.py", line_range: [69, 75], symbol: "execute" }
        - { file: "django/core/management/commands/sqlmigrate.py", line_range: [39, 40], symbol: "execute" }
      files:
        - "django/core/management/base.py"
        - "django/core/management/__init__.py"
        - "django/core/management/commands/runserver.py"
        - "django/core/management/commands/sqlmigrate.py"
      facts:
        - ["call_command", "management/__init__.py"]
        - ["runserver", "sqlmigrate"]
        - ["run_from_argv", "super().execute"]
      forbidden: []
      forbidden_strict: false

  - id: django-impact-02
    task_type: impact
    difficulty: medium
    question: "If `get_resolver` in `django/urls/resolvers.py` were renamed to `build_resolver`, which files would need updating?"
    rubric: |
      get_resolver is imported and used in multiple Django modules:
        - django/core/handlers/base.py (line 11 import, line 309/311 calls)
        - django/core/handlers/exception.py (line 19 import, multiple calls)
        - django/core/checks/urls.py (three import+call sites: lines 13, 41, 127)
        - django/utils/autoreload.py (line 332 import, line 337 call)
        - django/contrib/admindocs/views.py (line 20 import, line 146 call)
        Also django/urls/__init__.py re-exports get_resolver; renaming requires
        updating the __init__.py barrel export too.
      Bonus: notes that _get_cached_resolver (the private cache wrapper at line 115)
      would also be renamed for consistency, impacting only resolvers.py internals.
      Penalize: listing only one or two import sites and claiming the impact is small,
      or missing the django/urls/__init__.py re-export which is the public API.
    expected:
      citations:
        - { file: "django/urls/resolvers.py", line_range: [108, 117], symbol: "get_resolver" }
        - { file: "django/core/handlers/base.py", line_range: [11, 11], symbol: "get_resolver" }
        - { file: "django/core/handlers/exception.py", line_range: [19, 19], symbol: "get_resolver" }
        - { file: "django/core/checks/urls.py", line_range: [13, 15], symbol: "get_resolver" }
      files:
        - "django/urls/resolvers.py"
        - "django/urls/__init__.py"
        - "django/core/handlers/base.py"
        - "django/core/handlers/exception.py"
        - "django/core/checks/urls.py"
        - "django/utils/autoreload.py"
        - "django/contrib/admindocs/views.py"
      facts:
        - ["django/core/handlers/base.py", "django/core/handlers/exception.py"]
        - ["django/core/checks/urls.py", "autoreload.py"]
        - ["django/urls/__init__.py", "re-export"]
      forbidden: []
      forbidden_strict: false

  - id: django-impact-03
    task_type: impact
    difficulty: hard
    question: "If `Apps.populate()` in `django/apps/registry.py` were changed to skip Phase 3 (i.e., never call `app_config.ready()`), what would break?"
    rubric: |
      Phase 3 calls AppConfig.ready() for each installed app. This is where
      apps register signal handlers, connect receivers, and run startup logic.
      Concrete impacts:
        - Signal receivers registered in ready() (e.g., django.contrib.auth's
          post_migrate signal in apps.py) would never connect.
        - Checks registered via django.core.checks.register inside ready() would
          not be registered.
        - Third-party apps and user apps that connect signals or perform one-time
          setup in their AppConfig.ready() would silently break.
        - self.ready and self.ready_event.set() (line 126-127) would never be set,
          causing check_apps_ready() to consider the registry not ready, blocking
          any code that awaits that event.
      Must cite registry.py (populate, lines 122-127) and config.py (ready, line 271).
      Bonus: notes that ready_event (line 127) would not be set, which could hang
      multi-threaded startup scenarios.
      Penalize: claiming only "signals won't work" without naming specific Django
      internals that use ready(), or not citing the ready_event.set() consequence.
    expected:
      citations:
        - { file: "django/apps/registry.py", line_range: [61, 128], symbol: "populate" }
        - { file: "django/apps/config.py", line_range: [271, 274], symbol: "ready" }
      files:
        - "django/apps/registry.py"
        - "django/apps/config.py"
      facts:
        - ["app_config.ready", "AppConfig.ready"]
        - ["signal", "receiver", "post_migrate"]
        - ["ready_event", "apps_ready"]
      forbidden: []
      forbidden_strict: false

  # ---------------------------------------------------------------------------
  # architectural (3)
  # ---------------------------------------------------------------------------

  - id: django-arch-01
    task_type: architectural
    difficulty: medium
    question: "What is the boundary between `django.db` and `django.db.backends`? Which layer knows about SQL and which layer is database-agnostic?"
    rubric: |
      django.db (the public API): Model, QuerySet, Field types, managers, and
      signals live here. These classes are database-agnostic; they build abstract
      query objects (django/db/models/sql/query.py) without knowing the target DB.
      django.db.backends (the adapter layer): BaseDatabaseWrapper
      (django/db/backends/base/base.py, line 30), BaseDatabaseOperations
      (django/db/backends/base/operations.py, line 18), and BaseDatabaseSchemaEditor
      (django/db/backends/base/schema.py, line 76) define the interface that
      vendor-specific backends (postgresql/, sqlite3/, mysql/, oracle/) implement.
      The compiler layer (django/db/models/sql/compiler.py, SQLCompiler, line 39)
      is the bridge: it turns abstract Query objects into SQL strings using the
      connection's backend-specific operations.
      Must cite at least base/base.py and sql/compiler.py.
      Bonus: notes that ConnectionHandler (django/db/__init__.py) dispatches to
      the correct backend based on DATABASES settings.
      Penalize: claiming django.db and django.db.backends are the same layer, or
      saying all SQL generation happens inside the models layer without mentioning
      the compiler.
    expected:
      citations:
        - { file: "django/db/backends/base/base.py", line_range: [30, 60], symbol: "BaseDatabaseWrapper" }
        - { file: "django/db/backends/base/operations.py", line_range: [18, 50], symbol: "BaseDatabaseOperations" }
        - { file: "django/db/models/sql/compiler.py", line_range: [39, 100], symbol: "SQLCompiler" }
      files:
        - "django/db/backends/base/base.py"
        - "django/db/backends/base/operations.py"
        - "django/db/models/sql/compiler.py"
        - "django/db/__init__.py"
      facts:
        - ["BaseDatabaseWrapper", "backends"]
        - ["SQLCompiler", "compiler"]
        - ["backend-agnostic", "abstract", "vendor"]
      forbidden: []
      forbidden_strict: false

  - id: django-arch-02
    task_type: architectural
    difficulty: medium
    question: "How is the Django test runner organized? What is `DiscoverRunner` and how does it relate to the app loader?"
    rubric: |
      DiscoverRunner is the default test runner (django/test/runner.py, line 637).
      It orchestrates test execution in four stages:
        1. setup_test_environment (line 844): patches settings (EMAIL_BACKEND,
           ALLOWED_HOSTS, etc.) for test isolation.
        2. build_suite: uses unittest's test discovery to find test cases.
        3. setup_databases (line 963): creates test databases by calling
           BaseDatabaseCreation for each connection.
        4. run_tests (line 1049): runs the suite, tears down databases.
      The app loader (django/apps/registry.py, Apps.populate) runs BEFORE
      DiscoverRunner is even instantiated; the test runner assumes apps are already
      fully loaded and ready. DiscoverRunner does NOT re-populate the app registry.
      It does pass app labels to filter which test modules to discover.
      Must cite runner.py (DiscoverRunner) and note it is separate from the app
      loader.
      Bonus: notes the parallel test support via ParallelTestSuite (line 463) and
      that setup_databases is skipped when databases=() in the test class.
      Penalize: saying DiscoverRunner calls apps.populate, or conflating test
      discovery with app configuration.
    expected:
      citations:
        - { file: "django/test/runner.py", line_range: [637, 700], symbol: "DiscoverRunner" }
        - { file: "django/test/runner.py", line_range: [844, 963], symbol: "setup_test_environment" }
        - { file: "django/test/runner.py", line_range: [963, 1048], symbol: "setup_databases" }
        - { file: "django/test/runner.py", line_range: [1049, 1091], symbol: "run_tests" }
      files:
        - "django/test/runner.py"
        - "django/apps/registry.py"
      facts:
        - ["DiscoverRunner", "test runner"]
        - ["setup_databases", "setup_test_environment"]
        - ["apps are already loaded", "does not populate", "assumes ready"]
      forbidden: []
      forbidden_strict: false

  - id: django-arch-03
    task_type: architectural
    difficulty: hard
    question: "How does Django's middleware system work architecturally? How is the middleware chain assembled at startup and how does it wrap the view layer?"
    rubric: |
      BaseHandler.load_middleware (django/core/handlers/base.py, line 26) assembles
      the chain at startup (called from WSGIHandler.__init__ / ASGIHandler.__init__).
      It iterates settings.MIDDLEWARE in reverse, instantiating each class with the
      previous handler as get_response. This builds a nested callable stack so each
      middleware wraps all middleware below it plus the view.
      The innermost callable is convert_exception_to_response(_get_response), where
      _get_response (line 174) does the actual URL resolution and view dispatch.
      MiddlewareMixin (django/utils/deprecation.py, line 95) adapts old-style
      process_request/process_response middleware to the new single-callable pattern.
      Middleware that declares async_capable=True can run in async mode; adapt_method_mode
      (line 104) handles sync/async interop.
      Must cite base.py load_middleware, deprecation.py MiddlewareMixin.
      Bonus: notes that process_view and process_exception hooks are collected
      separately into _view_middleware and _exception_middleware lists (lines 77-93).
      Penalize: claiming middleware is applied per-request at dispatch time rather
      than being pre-assembled into a chain at startup.
    expected:
      citations:
        - { file: "django/core/handlers/base.py", line_range: [26, 102], symbol: "load_middleware" }
        - { file: "django/utils/deprecation.py", line_range: [95, 151], symbol: "MiddlewareMixin" }
        - { file: "django/core/handlers/base.py", line_range: [174, 228], symbol: "_get_response" }
      files:
        - "django/core/handlers/base.py"
        - "django/utils/deprecation.py"
      facts:
        - ["load_middleware", "reversed"]
        - ["MiddlewareMixin", "process_request", "process_response"]
        - ["_middleware_chain", "convert_exception_to_response"]
      forbidden: []
      forbidden_strict: false

