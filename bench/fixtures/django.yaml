  - id: django-multi-hop-01
    task_type: multi_hop
    difficulty: medium
    question: "Trace how an incoming HTTP request becomes an HttpResponse in the WSGI path. Which files and methods are involved, in order?"
    rubric: |
      Must trace:
        1. WSGIHandler.__call__ (django/core/handlers/wsgi.py, line 120): creates
           WSGIRequest from environ, calls self.get_response(request).
        2. BaseHandler.get_response (django/core/handlers/base.py, line 136):
           sets up urlconf, calls self._middleware_chain(request).
        3. _middleware_chain is built by load_middleware (line 26) from
           settings.MIDDLEWARE reversed as a chain of callables.
        4. BaseHandler._get_response (line 174): calls resolve_request (line 300)
           to get the view via URLResolver.resolve, then calls the view with args/kwargs.
        5. View's return value is the HttpResponse.
      Must cite wsgi.py, base.py. load_middleware is required context.
      Bonus: notes that exception handling is done by convert_exception_to_response
      (from django/core/handlers/exception.py) wrapping each middleware.
      Penalize: omitting the middleware chain, or claiming the URL resolver is
      invoked before middleware runs (middleware wraps _get_response, not __call__).
    expected:
      citations:
        - { file: "django/core/handlers/wsgi.py", line_range: [120, 144], symbol: "WSGIHandler" }
        - { file: "django/core/handlers/base.py", line_range: [136, 150], symbol: "get_response" }
        - { file: "django/core/handlers/base.py", line_range: [26, 102], symbol: "load_middleware" }
        - { file: "django/core/handlers/base.py", line_range: [174, 228], symbol: "_get_response" }
        - { file: "django/core/handlers/base.py", line_range: [300, 315], symbol: "resolve_request" }
      files:
        - "django/core/handlers/wsgi.py"
        - "django/core/handlers/base.py"
        - "django/urls/resolvers.py"
      facts:
        - ["WSGIHandler.__call__", "WSGIHandler"]
        - ["_middleware_chain", "load_middleware"]
        - ["resolve_request", "URLResolver"]
      forbidden:
        - "django/core/handlers/asgi.py"
      forbidden_strict: false

  - id: django-multi-hop-02
    task_type: multi_hop
    difficulty: hard
    question: "Trace how `Model.save()` reaches the database. Walk from the public save() call through to cursor.execute()."
    rubric: |
      Must trace:
        1. Model.save (django/db/models/base.py, line 821): validates args, calls
           save_base.
        2. Model.save_base (line 952): sends pre_save signal, calls _save_table.
        3. Model._save_table (line 1071): determines INSERT vs UPDATE. Calls
           _do_insert (line 1197) or _do_update (line 1169).
        4. _do_insert calls manager._insert (line 1202) which delegates to
           QuerySet._insert (django/db/models/query.py, line 1822).
        5. QuerySet._insert builds a sql.InsertQuery and calls
           query.get_compiler(using).execute_sql (django/db/models/sql/compiler.py,
           SQLInsertCompiler.execute_sql, line 1825).
        6. SQLInsertCompiler.execute_sql opens connection.cursor() and calls
           cursor.execute(sql, params).
      Must cite base.py (save, save_base, _save_table), query.py (_insert), and
      compiler.py (execute_sql).
      Bonus: notes the pre_save / post_save signals sent in save_base.
      Penalize: skipping _save_table and jumping directly from save() to cursor.execute,
      or claiming only UPDATE happens (Django decides INSERT vs UPDATE based on pk).
    expected:
      citations:
        - { file: "django/db/models/base.py", line_range: [821, 951], symbol: "save" }
        - { file: "django/db/models/base.py", line_range: [952, 1070], symbol: "save_base" }
        - { file: "django/db/models/base.py", line_range: [1071, 1168], symbol: "_save_table" }
        - { file: "django/db/models/base.py", line_range: [1197, 1208], symbol: "_do_insert" }
        - { file: "django/db/models/query.py", line_range: [1822, 1850], symbol: "_insert" }
        - { file: "django/db/models/sql/compiler.py", line_range: [1825, 1860], symbol: "execute_sql" }
      files:
        - "django/db/models/base.py"
        - "django/db/models/query.py"
        - "django/db/models/sql/compiler.py"
      facts:
        - ["save_base", "_save_table"]
        - ["_do_insert", "QuerySet._insert"]
        - ["SQLInsertCompiler", "cursor.execute"]
      forbidden: []
      forbidden_strict: false

  - id: django-multi-hop-03
    task_type: multi_hop
    difficulty: medium
    question: "Walk through how `manage.py runserver` boots the development server. What files are invoked and in what order?"
    rubric: |
      Must trace:
        1. ManagementUtility.execute (django/core/management/__init__.py, line ~194)
           discovers and executes the 'runserver' management command.
        2. runserver Command (django/core/management/commands/runserver.py, line 26):
           handle() parses address/port, calls self.run().
        3. Command.run (line 114): if use_reloader, wraps inner_run with
           autoreload.run_with_reloader; otherwise calls inner_run directly.
        4. inner_run (line 123): calls self.get_handler() which returns
           get_internal_wsgi_application() from django/core/servers/basehttp.py,
           then calls run(addr, port, handler, ...) (line 256 in basehttp.py).
        5. basehttp.run() creates a WSGIServer (line 68), sets the WSGI app, and
           calls httpd.serve_forever().
      Must cite runserver.py and basehttp.py.
      Bonus: notes that ASGIHandler is NOT used by default runserver (WSGI only),
      and that autoreload.run_with_reloader spawns a child process.
      Penalize: claiming runserver directly creates a Django ASGI server, or
      omitting the autoreload layer when use_reloader is True.
    expected:
      citations:
        - { file: "django/core/management/commands/runserver.py", line_range: [114, 170], symbol: "Command" }
        - { file: "django/core/management/commands/runserver.py", line_range: [123, 170], symbol: "inner_run" }
        - { file: "django/core/servers/basehttp.py", line_range: [256, 282], symbol: "run" }
        - { file: "django/core/servers/basehttp.py", line_range: [68, 100], symbol: "WSGIServer" }
      files:
        - "django/core/management/commands/runserver.py"
        - "django/core/servers/basehttp.py"
        - "django/utils/autoreload.py"
      facts:
        - ["inner_run", "get_handler"]
        - ["WSGIServer", "serve_forever"]
        - ["autoreload", "run_with_reloader"]
      forbidden:
        - "django/core/handlers/asgi.py"
      forbidden_strict: false

  - id: django-multi-hop-04
    task_type: multi_hop
    difficulty: hard
    question: "Trace how a URL path is resolved to a view callable in Django. Walk from `resolve_request` through `URLResolver.resolve` to `ResolverMatch`."
    rubric: |
      Must trace:
        1. BaseHandler.resolve_request (django/core/handlers/base.py, line 300):
           gets the resolver via get_resolver (django/urls/resolvers.py, line 108),
           calls resolver.resolve(request.path_info).
        2. get_resolver (line 108) calls _get_cached_resolver which returns a
           URLResolver wrapping ROOT_URLCONF. The resolver is cached via
           functools.cache (line 114).
        3. URLResolver.resolve (django/urls/resolvers.py, line 660): iterates
           self.url_patterns, calls each pattern's resolve(). For URLPattern.resolve
           (line 461), a regex or route match returns a ResolverMatch. For nested
           URLResolver, recursion handles namespaces.
        4. ResolverMatch is stored on request.resolver_match and returned.
      Must cite base.py resolve_request, resolvers.py get_resolver, and
      URLResolver.resolve / URLPattern.resolve.
      Bonus: notes that _get_cached_resolver caches resolvers by urlconf string to
      avoid re-parsing on every request.
      Penalize: claiming URL resolution happens inside middleware, or omitting the
      caching layer for get_resolver.
    expected:
      citations:
        - { file: "django/core/handlers/base.py", line_range: [300, 315], symbol: "resolve_request" }
        - { file: "django/urls/resolvers.py", line_range: [108, 117], symbol: "get_resolver" }
        - { file: "django/urls/resolvers.py", line_range: [660, 720], symbol: "URLResolver" }
        - { file: "django/urls/resolvers.py", line_range: [461, 490], symbol: "URLPattern" }
      files:
        - "django/core/handlers/base.py"
        - "django/urls/resolvers.py"
      facts:
        - ["resolve_request", "get_resolver"]
        - ["URLResolver.resolve", "URLPattern.resolve"]
        - ["ResolverMatch", "request.resolver_match"]
      forbidden: []
      forbidden_strict: false

  # ---------------------------------------------------------------------------
  # impact (3)
