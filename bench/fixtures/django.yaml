  - id: django-concept-01
    task_type: concept
    difficulty: medium
    question: "Where does Django handle CSRF token verification? Which method is responsible and what checks does it perform?"
    rubric: |
      Must cite django/middleware/csrf.py and identify CsrfViewMiddleware (line 165)
      as the class responsible. The key method is process_view (line 414): it checks
      whether the view is CSRF-exempt, enforces HTTPS for secure origins (Referer
      header), then compares the token from the cookie against the token submitted
      in the POST data or the X-CSRFToken header using _does_token_match (line 143).
      Bonus: notes the RejectRequest exception (line 160) and how _does_token_match
      uses a constant-time comparison and handles both masked and unmasked tokens.
      Penalize: attributing CSRF verification only to the get_token() helper
      (line 96) without explaining process_view, or confusing the decorator-based
      csrf_protect with the middleware class.
    expected:
      citations:
        - { file: "django/middleware/csrf.py", line_range: [165, 250], symbol: "CsrfViewMiddleware" }
        - { file: "django/middleware/csrf.py", line_range: [414, 483], symbol: "process_view" }
        - { file: "django/middleware/csrf.py", line_range: [143, 159], symbol: "_does_token_match" }
      files:
        - "django/middleware/csrf.py"
      facts:
        - ["CsrfViewMiddleware", "csrf middleware"]
        - ["process_view", "line 414"]
        - ["_does_token_match", "token comparison"]
      forbidden:
        - "django/views/decorators/csrf.py"
      forbidden_strict: false

  - id: django-concept-02
    task_type: concept
    difficulty: medium
    question: "How does Django load app configurations at startup? Walk through the three phases of `Apps.populate()`."
    rubric: |
      Must cite django/apps/registry.py and identify Apps.populate (line 61) as the
      entry point. Must describe all three phases:
        Phase 1 (line 87): iterates INSTALLED_APPS, creates AppConfig instances via
          AppConfig.create, stores them in self.app_configs; sets apps_ready = True.
        Phase 2 (line 114): calls app_config.import_models() for each app; sets
          models_ready = True.
        Phase 3 (line 122): calls app_config.ready() for each app; sets ready = True
          and fires ready_event.
      Must also cite django/apps/config.py for AppConfig.import_models (line 262)
      and AppConfig.ready (line 271).
      Bonus: notes the thread-safety lock and the guard against reentrant calls.
      Penalize: omitting the three-phase structure, or conflating Apps.populate with
      AppConfig.ready (the former orchestrates, the latter is a user hook).
    expected:
      citations:
        - { file: "django/apps/registry.py", line_range: [61, 128], symbol: "populate" }
        - { file: "django/apps/config.py", line_range: [262, 274], symbol: "import_models" }
        - { file: "django/apps/config.py", line_range: [271, 274], symbol: "ready" }
      files:
        - "django/apps/registry.py"
        - "django/apps/config.py"
      facts:
        - ["populate", "Apps.populate"]
        - ["apps_ready", "models_ready"]
        - ["app_config.ready", "AppConfig.ready"]
      forbidden:
        - "django/setup.py"
      forbidden_strict: false

  - id: django-concept-03
    task_type: concept
    difficulty: medium
    question: "Where is the autoreloader implemented in Django? What are the two reloader strategies and how does Django pick between them?"
    rubric: |
      Must cite django/utils/autoreload.py. The two strategies are:
        StatReloader (line 384): polls file mtimes at a fixed interval using
        inotify-style stat checks. Always available.
        WatchmanReloader (line 431): uses Facebook Watchman via pywatchman for
        event-driven file watching. Preferred when available.
      get_reloader (line 640) decides: tries WatchmanReloader first, falls back to
      StatReloader if WatchmanUnavailable is raised. run_with_reloader (line 663)
      calls get_reloader and runs start_django in a thread, with the reloader
      looping in the main thread.
      Bonus: notes that restarting is done by raising SystemExit (triggering
      restart_with_reloader, line 270) which re-execs the process via
      get_child_arguments.
      Penalize: claiming only one reloader strategy exists, or attributing the
      autoreload to the WSGI server itself.
    expected:
      citations:
        - { file: "django/utils/autoreload.py", line_range: [384, 430], symbol: "StatReloader" }
        - { file: "django/utils/autoreload.py", line_range: [431, 639], symbol: "WatchmanReloader" }
        - { file: "django/utils/autoreload.py", line_range: [640, 647], symbol: "get_reloader" }
      files:
        - "django/utils/autoreload.py"
      facts:
        - ["StatReloader", "stat reloader"]
        - ["WatchmanReloader", "Watchman"]
        - ["get_reloader", "WatchmanUnavailable"]
      forbidden: []
      forbidden_strict: false

  - id: django-concept-04
    task_type: concept
    difficulty: hard
    question: "How does Django render a Template end-to-end? Trace from Template instantiation to the returned HTML string."
    rubric: |
      Must cite django/template/base.py. Template.__init__ (line 139) calls
      compile_nodelist (line 175): creates a Lexer (or DebugLexer in debug mode)
      to tokenize the source, then a Parser (line 435) to parse tokens into a
      NodeList of Node instances.
      Template.render (line 165) calls _render (line 162) which calls
      self.nodelist.render(context) (NodeList.render, line 1002). Each Node in
      the list renders itself and the results are concatenated into the final HTML.
      Must note the context.render_context.push_state context manager used by
      render (line 167).
      Bonus: explains the difference between Lexer (returns Token objects) and
      Parser (returns Node objects), and that TextNode simply returns its content
      while tag nodes like IfNode have logic.
      Penalize: omitting the NodeList intermediate representation, or claiming
      template rendering happens in django/template/engine.py (which manages
      template loading, not the render pass).
    expected:
      citations:
        - { file: "django/template/base.py", line_range: [139, 200], symbol: "Template" }
        - { file: "django/template/base.py", line_range: [175, 210], symbol: "compile_nodelist" }
        - { file: "django/template/base.py", line_range: [165, 173], symbol: "render" }
        - { file: "django/template/base.py", line_range: [1002, 1020], symbol: "NodeList" }
      files:
        - "django/template/base.py"
      facts:
        - ["compile_nodelist", "Lexer", "Parser"]
        - ["NodeList", "Node"]
        - ["nodelist.render", "context"]
      forbidden:
        - "django/template/engine.py"
      forbidden_strict: false

  # ---------------------------------------------------------------------------
  # multi_hop (4)
