  - id: wolfmax-concept-01
    task_type: concept
    difficulty: medium
    question: "Where does authentication happen for protected API routes? How does a route opt in to requiring a session?"
    rubric: |
      Must cite packages/backend/src/auth/macro.ts and explain authPlugin (line 107):
      routes use .use(authPlugin) to require a valid session. authPlugin calls
      auth.api.getSession with request headers; returns 401 if no session.
      Bonus: explains that adminPlugin (line 123) additionally checks for the 'admin'
      role in user.roles, returning 403 for non-admins.
      Penalize: pointing only at packages/backend/src/auth/index.ts (which configures
      better-auth but does not enforce per-route auth), or claiming authentication
      is handled by middleware applied globally to all routes.
    expected:
      citations:
        - { file: "packages/backend/src/auth/macro.ts", line_range: [107, 141], symbol: "authPlugin" }
      files:
        - "packages/backend/src/auth/macro.ts"
        - "packages/backend/src/auth/index.ts"
      facts:
        - ["authPlugin", "auth-plugin"]
        - ["getSession", "auth.api.getSession"]
        - ["401", "status(401)"]
      forbidden:
        - "packages/backend/src/app.ts"
      forbidden_strict: false

  - id: wolfmax-concept-02
    task_type: concept
    difficulty: medium
    question: "How are analytics events stored anonymously? Where does the anonymisation happen and what algorithm is used?"
    rubric: |
      Must cite packages/backend/src/lib/analytics-hash.ts and explain hashAnonymousId
      (line 9): uses SHA-512 with BETTER_AUTH_SECRET as a salt to hash the userId,
      producing an irreversible anonymous identifier stored in analytics_events.
      Must also cite packages/backend/src/api/analytics/events.ts (line 43) as where
      hashAnonymousId is called before inserting events.
      Bonus: notes that Bun.CryptoHasher is used (not Node crypto), and that this
      enables funnel analysis without PII in the analytics table.
      Penalize: saying SHA-256 is used, or claiming the raw userId is hashed without
      a salt.
    expected:
      citations:
        - { file: "packages/backend/src/lib/analytics-hash.ts", line_range: [9, 13], symbol: "hashAnonymousId" }
        - { file: "packages/backend/src/api/analytics/events.ts", line_range: [43, 43], symbol: "analyticsEventsRouter" }
      files:
        - "packages/backend/src/lib/analytics-hash.ts"
        - "packages/backend/src/api/analytics/events.ts"
      facts:
        - "hashAnonymousId"
        - ["SHA-512", "sha512"]
        - ["BETTER_AUTH_SECRET", "salt"]
      forbidden:
        - "SHA-256"
      forbidden_strict: false

  - id: wolfmax-concept-03
    task_type: concept
    difficulty: hard
    question: "Where is the OTS (OpenTimestamps) proof upgrade logic triggered on the read path? Trace from the epoch proof endpoint (GET /:id/proof) to the calendar poll."
    rubric: |
      Must cite packages/backend/src/api/crypto/epochs.ts (the GET /:id/proof handler,
      around line 146) and packages/backend/src/api/crypto/upgrade-helper.ts
      (upgradeAggregationTree, line 83). Must explain that on every /proof read,
      upgradeAggregationTree is called, which internally calls pollAnyCalendar from
      packages/backend/src/lib/ots-poll.ts. pollAnyCalendar races all configured
      calendars in parallel with a 5s budget.
      Bonus: notes that shouldAttemptUpgrade (upgrade-helper.ts line 11) applies a
      rate-limit guard so upgrades are not attempted on every request.
      Note: reports.ts (GET /:uuid/proof -> upgradeReportLock) is a parallel on-demand
      upgrade path for report locks; mentioning it is acceptable and should not be
      penalized, but the epoch chain above is required. An answer covering ONLY the
      reports.ts chain does not answer the question as asked.
      Penalize: attributing upgrades only to the Rust backend-worker (which handles
      batch upgrades, not on-demand), or omitting the rate-limit guard.
    expected:
      citations:
        - { file: "packages/backend/src/api/crypto/epochs.ts", line_range: [146, 221], symbol: "cryptoEpochsRouter" }
        - { file: "packages/backend/src/api/crypto/upgrade-helper.ts", line_range: [83, 115], symbol: "upgradeAggregationTree" }
        - { file: "packages/backend/src/lib/ots-poll.ts", line_range: [91, 136], symbol: "pollAnyCalendar" }
      files:
        - "packages/backend/src/api/crypto/epochs.ts"
        - "packages/backend/src/api/crypto/upgrade-helper.ts"
        - "packages/backend/src/lib/ots-poll.ts"
      facts:
        - ["upgradeAggregationTree", "upgrade"]
        - ["pollAnyCalendar", "calendar poll"]
        - ["5s", "5000", "budget"]
      forbidden:
        - "packages/backend-worker/src/aggregation.rs"
      forbidden_strict: false

  - id: wolfmax-concept-04
    task_type: concept
    difficulty: medium
    question: "Which background jobs are wired into the backend scheduler at startup, and how often does each scheduled job run?"
    rubric: |
      Scope this answer to jobs actually registered by startScheduler, rather
      than every maintenance helper or worker that can run in the repository.
      Must cite packages/backend/src/jobs/scheduler.ts (startScheduler, line 21).
      Must explain: release sync runs every 5 minutes (RELEASE_SYNC_INTERVAL_MS),
      with an initial 10-second delay. Must cite packages/backend/src/jobs/release-sync.ts
      (syncReleases, line 86) as the only job currently wired.
      Must cite packages/backend/src/index.ts (line 59) as where startScheduler is
      called during server startup.
      Bonus: notes the syncReleases job fetches S3 update manifests for
      darwin-aarch64 and windows-x86_64 targets.
      Penalize: claiming there are multiple distinct jobs wired into this scheduler
      with different schedules, or stating the scheduler uses cron expressions (it
      uses setInterval). Do not penalize an answer that explicitly distinguishes an
      unrelated maintenance task from the scheduler's registered jobs.
    expected:
      citations:
        - { file: "packages/backend/src/jobs/scheduler.ts", line_range: [21, 56], symbol: "startScheduler" }
        - { file: "packages/backend/src/jobs/release-sync.ts", line_range: [86, 174], symbol: "syncReleases" }
      files:
        - "packages/backend/src/jobs/scheduler.ts"
        - "packages/backend/src/jobs/release-sync.ts"
        - "packages/backend/src/index.ts"
      facts:
        - ["5 minutes", "5 * 60", "RELEASE_SYNC_INTERVAL_MS"]
        - ["syncReleases", "release sync"]
        - ["setInterval", "interval"]
      forbidden:
        - "cron"
      forbidden_strict: false

