  - id: wolfmax-arch-01
    task_type: architectural
    difficulty: medium
    question: "What is the boundary between the API layer and the database layer in the backend? How do routes access the database?"
    rubric: |
      Must identify: all API routes import `db` from packages/backend/src/db/index.ts
      (a Drizzle PostgreSQL client). Routes use Drizzle's fluent query API directly
      (no repository pattern). For multi-step writes the db/transaction.ts withTransaction
      helper wraps them atomically.
      Schema definitions live in packages/backend/src/db/schema/*.ts and are re-exported
      via the barrel at packages/backend/src/db/schema/index.ts.
      Must cite at least db/index.ts and db/transaction.ts.
      Bonus: notes there is NO repository/service layer abstraction; routes import db
      directly and compose Drizzle queries inline.
      Penalize: claiming there is a repository layer or service classes mediating all
