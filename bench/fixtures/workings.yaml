  - id: wolfmax-arch-03
    task_type: architectural
    difficulty: hard
    question: "How is the crypto anchoring system split between the TypeScript backend and the Rust backend-worker? Which layer does what?"
    rubric: |
      TypeScript backend (packages/backend/src/api/crypto/):
      - Accepts epoch seals (POST /api/crypto/epochs) and report locks (POST /api/crypto/reports/:uuid/lock)
      - Signs receipts with Ed25519 via getReceiptSigner (receipt-signer.ts)
      - On GET /proof, attempts on-demand OTS upgrade via upgradeAggregationTree / upgradeReportLock
      Rust backend-worker (packages/backend-worker/src/):
      - Batches unprocessed epoch seals into Merkle trees (aggregation.rs)
      - Submits Merkle root / report root to OTS calendars (ots_submit.rs)
      - Retries stuck submissions (retry_stuck_pending_trees)
      Must cite at least aggregation.rs and api/crypto/epochs.ts.
      Bonus: notes the worker is a one-shot Fargate task (not a daemon), inferred from
      main.rs (runs aggregation::run + report_submit::run then exits).
      Penalize: saying the TypeScript layer aggregates seals into Merkle trees (it does
      not), or claiming the Rust worker handles on-demand proof upgrades.
