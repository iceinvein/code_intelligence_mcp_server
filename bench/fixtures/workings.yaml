  - id: wolfmax-symbol-01
    task_type: symbol_lookup
    difficulty: easy
    question: "Where is `authPlugin` defined? Give the file path and line."
    rubric: |
      Cites packages/backend/src/auth/macro.ts at line 107. Correct answer
      identifies authPlugin as an Elysia plugin that validates a session via
      auth.api.getSession and injects { user, session } into route context.
      Bonus: notes the companion adminPlugin defined in the same file at line 123.
      Penalize: pointing at packages/backend/src/auth/index.ts (where betterAuth
      is configured, not where authPlugin lives), or citing the wrong line.
    expected:
      citations:
        - { file: "packages/backend/src/auth/macro.ts", line_range: [107, 117], symbol: "authPlugin" }
      files:
        - "packages/backend/src/auth/macro.ts"
      facts:
        - "authPlugin"
        - ["Elysia", "elysia"]
        - ["getSession", "auth.api.getSession"]
      forbidden:
        - "packages/backend/src/auth/index.ts"
      forbidden_strict: false

  - id: wolfmax-symbol-02
    task_type: symbol_lookup
    difficulty: easy
    question: "Where is the `CircuitBreaker` class defined? Give the file path and line."
    rubric: |
      Cites packages/backend/src/email/circuit-breaker.ts at line 43. Correct
      answer identifies it as a class that tracks failure counts and implements
      CLOSED/OPEN/HALF_OPEN states for SES email resilience.
      Bonus: mentions the CircuitBreakerState enum defined earlier in the same file.
      Penalize: citing packages/backend/src/email/index.ts (which uses CircuitBreaker
      but does not define the class), or hallucinating a generic circuit-breaker
      package import.
    expected:
      citations:
        - { file: "packages/backend/src/email/circuit-breaker.ts", line_range: [43, 100], symbol: "CircuitBreaker" }
      files:
        - "packages/backend/src/email/circuit-breaker.ts"
      facts:
        - "CircuitBreaker"
        - ["class", "Class"]
        - ["CLOSED", "OPEN", "HALF_OPEN"]
      forbidden:
        - "packages/backend/src/email/index.ts"
      forbidden_strict: false

  - id: wolfmax-symbol-03
    task_type: symbol_lookup
    difficulty: easy
    question: "Where is `withTransaction` defined? Give the file path and line."
    rubric: |
      Cites packages/backend/src/db/transaction.ts at line 142. Correct answer
      describes it as an async function wrapping Drizzle's db.transaction() with
      structured error logging. It catches errors, logs them with operation name
      and duration, then rethrows as TransactionError.
      Bonus: notes the TransactionError class in the same file and the operation
