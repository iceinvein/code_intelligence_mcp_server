  - id: wolfmax-multi-hop-01
    task_type: multi_hop
    difficulty: hard
    question: "Trace the full path from a POST /api/invitations/:token/accept request to the database write that grants access. Which files are involved and in what order?"
    rubric: |
      Must trace: app.ts mounts invitationsRouter -> invitations.ts POST /:token/accept
      handler -> validateInvitationForAcceptance (line 36) checks the invitation ->
      betterAuthInstance.api.signUpEmail creates the user -> withTransaction
      (db/transaction.ts) wraps the post-signup DB writes ->
      inside the tx: accessInvitation is updated to 'accepted', then userAccess or member
      is inserted depending on inviteType.
      Must cite invitations.ts (core logic), db/transaction.ts (withTransaction),
      and db/schema/access.ts (tables written).
      Bonus: notes the checkOrganizationAndSeatLimit call (line 414) inside the
      transaction for org invites.
      Penalize: omitting the Better Auth signUpEmail step, or claiming the invitation
      is claimed before user creation (it is claimed inside the post-signup tx).
    expected:
      citations:
        - { file: "packages/backend/src/api/invitations.ts", line_range: [326, 515], symbol: "invitationsRouter" }
        - { file: "packages/backend/src/db/transaction.ts", line_range: [142, 194], symbol: "withTransaction" }
        - { file: "packages/backend/src/db/schema/access.ts", line_range: [9, 35], symbol: "userAccess" }
      files:
        - "packages/backend/src/api/invitations.ts"
        - "packages/backend/src/db/transaction.ts"
        - "packages/backend/src/app.ts"
        - "packages/backend/src/db/schema/access.ts"
      facts:
        - ["signUpEmail", "Better Auth"]
        - ["withTransaction", "transaction"]
        - ["userAccess", "member"]
      forbidden:
        - "packages/backend/src/api/admin/invitations.ts"
      forbidden_strict: false

  - id: wolfmax-multi-hop-02
    task_type: multi_hop
    difficulty: hard
    question: "Trace how a POST /api/crypto/epochs request reaches the database. Which files are involved and what is written?"
    rubric: |
      Must trace: app.ts uses cryptoEpochsRouter -> api/crypto/epochs.ts handles
      the POST / endpoint -> checks idempotency via a SELECT on epochSeals ->
      calls getReceiptSigner (lib/receipt-signer.ts) to sign the receipt ->
      calls isLate (lib/late-flag.ts) to compute the late flag ->
      then inserts a new row into epochSeals via db.insert with onConflictDoNothing.
      Must cite: api/crypto/epochs.ts, lib/receipt-signer.ts, lib/late-flag.ts,
      db/schema/crypto-anchoring.ts (epochSeals table).
      Bonus: notes the race-loss branch (inserted.length === 0, line 99) that
      re-reads the winning row.
      Penalize: claiming the worker (aggregation.rs) handles this write, or omitting
      the idempotency SELECT-then-INSERT pattern.
    expected:
      citations:
        - { file: "packages/backend/src/api/crypto/epochs.ts", line_range: [24, 143], symbol: "cryptoEpochsRouter" }
        - { file: "packages/backend/src/lib/receipt-signer.ts", line_range: [170, 201], symbol: "getReceiptSigner" }
        - { file: "packages/backend/src/lib/late-flag.ts", line_range: [12, 16], symbol: "isLate" }
      files:
        - "packages/backend/src/api/crypto/epochs.ts"
        - "packages/backend/src/lib/receipt-signer.ts"
        - "packages/backend/src/lib/late-flag.ts"
        - "packages/backend/src/db/schema/crypto-anchoring.ts"
      facts:
        - ["epochSeals", "epoch_seals"]
        - ["getReceiptSigner", "receipt signer"]
        - ["onConflictDoNothing", "idempotent"]
      forbidden:
        - "packages/backend-worker/src/aggregation.rs"
      forbidden_strict: false

  - id: wolfmax-multi-hop-03
    task_type: multi_hop
    difficulty: medium
    question: "Trace how the desktop app receives a session token after completing the web-based login flow. What endpoints and files are involved?"
    rubric: |
      Must trace: authenticated user hits POST /api/desktop-auth/complete (desktop-auth.ts
      line 37) with an encrypted user key payload and a state string -> a short-lived
      exchange code is stored in desktopAuthExchangeCodes -> then the desktop app calls
      POST /api/desktop-auth/exchange with the code and state -> the record is atomically
      deleted inside withTransaction (db/transaction.ts) -> returns sessionToken and
      encryptedUserKeyPayload.
      Must cite: api/desktop-auth.ts, db/schema/user-keys.ts (desktopAuthExchangeCodes),
      db/transaction.ts.
      Bonus: notes the 2-minute CODE_TTL_MS and the nanoid(48) code generation.
      Penalize: claiming session tokens are issued directly by the /complete endpoint
      without the exchange step.
    expected:
      citations:
        - { file: "packages/backend/src/api/desktop-auth.ts", line_range: [37, 103], symbol: "desktopAuthRouter" }
        - { file: "packages/backend/src/db/schema/user-keys.ts", line_range: [51, 70], symbol: "desktopAuthExchangeCodes" }
      files:
        - "packages/backend/src/api/desktop-auth.ts"
        - "packages/backend/src/db/schema/user-keys.ts"
        - "packages/backend/src/db/transaction.ts"
      facts:
        - ["desktopAuthExchangeCodes", "exchange code"]
        - ["sessionToken", "session token"]
        - ["/exchange", "exchange endpoint"]
      forbidden:
        - "packages/backend/src/auth/index.ts"
      forbidden_strict: false

  - id: wolfmax-multi-hop-04
    task_type: multi_hop
    difficulty: hard
    question: "Trace how the Rust backend-worker builds and submits an aggregation tree. Walk from the main function through to the OTS calendar submission."
    rubric: |
      Must trace: packages/backend-worker/src/main.rs calls aggregation::run ->
      aggregation.rs aggregate_new_seals claims unaggregated epochSeals rows using
      FOR UPDATE SKIP LOCKED -> builds MerkleTree (merkle.rs, MerkleTree::build) ->
      inserts aggregation_trees row and updates epoch_seals with inclusion proofs ->
      calls submit_tree which calls ots_submit::submit_to_any_calendar (ots_submit.rs).
      Must cite: main.rs, aggregation.rs, merkle.rs, ots_submit.rs.
      Bonus: notes SUBMIT_CONCURRENCY = 8 for parallel OTS submissions in retry_stuck_pending_trees.
      Penalize: conflating the TypeScript pollAnyCalendar (read-path) with the Rust
      submit_to_any_calendar (write-path), or omitting the Merkle tree step.
    expected:
      citations:
        - { file: "packages/backend-worker/src/main.rs", line_range: [13, 41], symbol: "main" }
        - { file: "packages/backend-worker/src/aggregation.rs", line_range: [17, 111], symbol: "run" }
        - { file: "packages/backend-worker/src/merkle.rs", line_range: [46, 60], symbol: "MerkleTree" }
      files:
        - "packages/backend-worker/src/main.rs"
        - "packages/backend-worker/src/aggregation.rs"
        - "packages/backend-worker/src/merkle.rs"
        - "packages/backend-worker/src/ots_submit.rs"
      facts:
        - ["MerkleTree", "merkle tree"]
        - ["submit_to_any_calendar", "OTS submit"]
        - ["FOR UPDATE SKIP LOCKED", "SKIP LOCKED"]
      forbidden:
        - "packages/backend/src/lib/ots-poll.ts"
      forbidden_strict: false

