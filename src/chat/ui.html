<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Intelligence Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a2e;
      --chat-bg:   #16213e;
      --user-bg:   #0f3460;
      --asst-bg:   #1a1a2e;
      --tool-bg:   #2d2d44;
      --text:      #e0e0e0;
      --text-dim:  #8888aa;
      --accent:    #00d4ff;
      --border:    #2d2d55;
      --input-bg:  #0d1b2a;
      --send-bg:   #0f3460;
      --send-hover:#1a4a80;
    }

    body.light {
      --bg:        #f5f5f5;
      --chat-bg:   #ffffff;
      --user-bg:   #e3f2fd;
      --asst-bg:   #f5f5f5;
      --tool-bg:   #e8eaf6;
      --text:      #333333;
      --text-dim:  #777777;
      --accent:    #1565c0;
      --border:    #cccccc;
      --input-bg:  #ffffff;
      --send-bg:   #1565c0;
      --send-hover:#0d47a1;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
    }

    /* ---------- Layout ---------- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ---------- Header ---------- */
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    #header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    /* ---------- Repo dropdown ---------- */
    #repo-selector {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    #repo-trigger {
      width: 100%;
      padding: 6px 30px 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.85rem;
      font-family: "SF Mono", "Fira Code", monospace;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      appearance: none;
      position: relative;
    }

    #repo-trigger:hover { border-color: var(--accent); }
    #repo-trigger.open { border-color: var(--accent); }

    #repo-trigger::after {
      content: "\25BE";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.75rem;
      pointer-events: none;
    }

    #repo-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    #repo-dropdown.show { display: block; }

    .repo-option {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 1px;
      border-bottom: 1px solid var(--border);
    }

    .repo-option:last-child { border-bottom: none; }
    .repo-option:hover { background: var(--user-bg); }
    .repo-option.active { background: var(--user-bg); }

    .repo-option-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
    }

    .repo-option-path {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: "SF Mono", "Fira Code", monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-option.other-option {
      flex-direction: row;
      align-items: center;
      color: var(--accent);
      font-size: 0.85rem;
      gap: 6px;
    }

    #repo-custom-input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-top: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.85rem;
      font-family: "SF Mono", "Fira Code", monospace;
      outline: none;
      border-radius: 0 0 8px 8px;
    }

    #repo-custom-input::placeholder { color: var(--text-dim); }

    #theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      padding: 5px 9px;
      font-size: 1rem;
      flex-shrink: 0;
    }

    #theme-btn:hover { border-color: var(--accent); }

    /* ---------- Chat area ---------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--chat-bg);
      scroll-behavior: smooth;
    }

    /* ---------- Messages ---------- */
    .msg {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    .msg.user { align-items: flex-end; }
    .msg.assistant { align-items: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 3px;
    }

    .msg.assistant .bubble {
      background: var(--asst-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    /* Markdown typography inside bubbles */
    .bubble p  { margin-bottom: 0.6em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 0.8em 0 0.3em; }
    .bubble ul, .bubble ol { padding-left: 1.4em; margin-bottom: 0.5em; }
    .bubble li { margin-bottom: 0.2em; }
    .bubble a { color: var(--accent); }
    .bubble strong { color: var(--accent); }
    .bubble code:not([class]) {
      background: rgba(0,0,0,0.25);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.88em;
    }
    body.light .bubble code:not([class]) {
      background: rgba(0,0,0,0.08);
    }
    .bubble pre {
      margin: 0.6em 0;
      border-radius: 8px;
      overflow-x: auto;
    }
    .bubble pre code { font-size: 0.85em; }

    /* ---------- Tool indicators ---------- */
    .tool-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--tool-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
      max-width: 82%;
    }

    .tool-name { color: var(--accent); font-weight: 600; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-done-icon {
      color: #4caf50;
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* ---------- Footer (input area) ---------- */
    #footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      min-height: 42px;
      max-height: 160px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      overflow-y: auto;
      line-height: 1.5;
    }

    #user-input:focus { outline: none; border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-dim); }

    #send-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: var(--send-bg);
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: var(--send-hover); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    #new-chat-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 5px 12px;
      font-size: 0.85rem;
      transition: border-color 0.15s, color 0.15s;
    }

    #new-chat-btn:hover { border-color: var(--accent); color: var(--text); }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      flex-shrink: 0;
    }

    #status-dot.loading { background: #ff9800; animation: pulse 1s ease-in-out infinite; }
    #status-dot.error   { background: #f44336; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    #status-label { font-size: 0.78rem; color: var(--text-dim); }

    /* ---------- Error bubble ---------- */
    .error-bubble {
      background: rgba(244,67,54,0.15);
      border: 1px solid rgba(244,67,54,0.4);
      border-radius: 10px;
      padding: 9px 14px;
      color: #ef9a9a;
      font-size: 0.88rem;
      max-width: 82%;
    }

    /* ---------- Scrollbar ---------- */
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>Code Intelligence Chat</h1>
    <div id="repo-selector">
      <button id="repo-trigger">Select repo...</button>
      <div id="repo-dropdown"></div>
    </div>
    <button id="theme-btn" title="Toggle light/dark mode">&#9788;</button>
  </div>

  <div id="chat"></div>

  <div id="footer">
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Ask anything about the codebase... (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send-btn">Send</button>
    </div>
    <div id="bottom-row">
      <button id="new-chat-btn">New Chat</button>
      <div id="status-dot"></div>
      <span id="status-label">Ready</span>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------------------
  // Marked + highlight.js setup
  // ---------------------------------------------------------------------------
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    },
    breaks: true,
  });

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  var messages = [];
  var isStreaming = false;
  var userScrolledUp = false;
  var currentBubble = null;
  var currentText = '';
  var selectedRepoPath = '';
  var repos = [];

  // ---------------------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------------------
  var chat       = document.getElementById('chat');
  var inputEl    = document.getElementById('user-input');
  var sendBtn    = document.getElementById('send-btn');
  var newChatBtn = document.getElementById('new-chat-btn');
  var themeBtn   = document.getElementById('theme-btn');
  var repoTrigger  = document.getElementById('repo-trigger');
  var repoDropdown = document.getElementById('repo-dropdown');
  var repoSelector = document.getElementById('repo-selector');
  var statusDot  = document.getElementById('status-dot');
  var statusLbl  = document.getElementById('status-label');

  // ---------------------------------------------------------------------------
  // Theme toggle
  // ---------------------------------------------------------------------------
  themeBtn.addEventListener('click', function() {
    document.body.classList.toggle('light');
  });

  // ---------------------------------------------------------------------------
  // Repo dropdown
  // ---------------------------------------------------------------------------
  function fetchRepos() {
    fetch('/api/repos').then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      repos = data || [];
      buildDropdown();
      // Auto-select most recent if available
      if (repos.length > 0 && !selectedRepoPath) {
        selectRepo(repos[0].name, repos[0].path);
      }
    }).catch(function() {
      repos = [];
      buildDropdown();
    });
  }

  function buildDropdown() {
    // Clear
    while (repoDropdown.firstChild) repoDropdown.removeChild(repoDropdown.firstChild);

    repos.forEach(function(repo) {
      var opt = document.createElement('div');
      opt.className = 'repo-option';

      var name = document.createElement('div');
      name.className = 'repo-option-name';
      name.textContent = repo.name;

      var path = document.createElement('div');
      path.className = 'repo-option-path';
      path.textContent = repo.path;

      opt.appendChild(name);
      opt.appendChild(path);
      opt.addEventListener('click', function() {
        selectRepo(repo.name, repo.path);
        closeDropdown();
      });
      repoDropdown.appendChild(opt);
    });

    // "Other..." option
    var other = document.createElement('div');
    other.className = 'repo-option other-option';
    other.textContent = 'Other...';
    other.addEventListener('click', function(e) {
      e.stopPropagation();
      showCustomInput();
    });
    repoDropdown.appendChild(other);
  }

  function showCustomInput() {
    // Remove existing custom input if any
    var existing = document.getElementById('repo-custom-input');
    if (existing) { existing.focus(); return; }

    var input = document.createElement('input');
    input.id = 'repo-custom-input';
    input.type = 'text';
    input.placeholder = '/path/to/repo';
    input.spellcheck = false;
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var val = input.value.trim();
        if (val) {
          var name = val.split('/').filter(Boolean).pop() || val;
          selectRepo(name, val);
          closeDropdown();
        }
      }
      if (e.key === 'Escape') {
        closeDropdown();
      }
    });
    input.addEventListener('click', function(e) { e.stopPropagation(); });
    repoDropdown.appendChild(input);
    input.focus();
  }

  function selectRepo(name, path) {
    selectedRepoPath = path;
    repoTrigger.textContent = name;
    setStatus('ready', 'Repo: ' + name);
    // Reset status after 2 seconds
    setTimeout(function() {
      if (statusLbl.textContent === 'Repo: ' + name) {
        setStatus('ready', 'Ready');
      }
    }, 2000);
  }

  function toggleDropdown() {
    var isOpen = repoDropdown.classList.contains('show');
    if (isOpen) {
      closeDropdown();
    } else {
      repoDropdown.classList.add('show');
      repoTrigger.classList.add('open');
    }
  }

  function closeDropdown() {
    repoDropdown.classList.remove('show');
    repoTrigger.classList.remove('open');
    // Remove custom input if present
    var customInput = document.getElementById('repo-custom-input');
    if (customInput) customInput.remove();
  }

  repoTrigger.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleDropdown();
  });

  // Close on outside click
  document.addEventListener('click', function(e) {
    if (!repoSelector.contains(e.target)) {
      closeDropdown();
    }
  });

  // Keyboard navigation
  repoTrigger.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDropdown();
  });

  // ---------------------------------------------------------------------------
  // Auto-scroll detection
  // ---------------------------------------------------------------------------
  chat.addEventListener('scroll', function() {
    var distFromBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
    userScrolledUp = distFromBottom > 60;
  });

  function scrollToBottom() {
    if (!userScrolledUp) {
      chat.scrollTop = chat.scrollHeight;
    }
  }

  // ---------------------------------------------------------------------------
  // Auto-resize textarea
  // ---------------------------------------------------------------------------
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ---------------------------------------------------------------------------
  // New Chat
  // ---------------------------------------------------------------------------
  newChatBtn.addEventListener('click', function() {
    if (isStreaming) return;
    messages = [];
    chat.textContent = '';
    setStatus('ready', 'Ready');
  });

  // ---------------------------------------------------------------------------
  // DOM helpers (avoid innerHTML where possible; use it only for safe rendered HTML)
  // ---------------------------------------------------------------------------
  function escapeHtml(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(String(str)));
    return d.innerHTML;
  }

  function truncate(str, max) {
    str = String(str);
    return str.length > max ? str.slice(0, max) + '...' : str;
  }

  function summariseArgs(args) {
    if (!args || typeof args !== 'object') return '';
    var vals = Object.values(args);
    for (var i = 0; i < vals.length; i++) {
      if (typeof vals[i] === 'string' && vals[i].length > 0) {
        return '"' + truncate(vals[i], 60) + '"';
      }
    }
    return '';
  }

  function setStatus(state, label) {
    statusDot.className = '';
    if (state === 'loading') statusDot.classList.add('loading');
    if (state === 'error')   statusDot.classList.add('error');
    statusLbl.textContent = label;
  }

  function setInputEnabled(enabled) {
    inputEl.disabled = !enabled;
    sendBtn.disabled = !enabled;
    isStreaming = !enabled;
    if (enabled) inputEl.focus();
  }

  // Append a user message bubble (text is escaped)
  function appendUserMessage(text) {
    var outer = document.createElement('div');
    outer.className = 'msg user';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    outer.appendChild(bubble);
    chat.appendChild(outer);
    scrollToBottom();
  }

  // Create an empty assistant message bubble and return its inner .bubble div
  function createAssistantBubble() {
    var outer = document.createElement('div');
    outer.className = 'msg assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = '...';
    outer.appendChild(bubble);
    chat.appendChild(outer);
    scrollToBottom();
    return bubble;
  }

  // Render markdown into a bubble using marked (produces HTML from user-authored text)
  function renderMarkdown(bubble, text) {
    // marked.parse returns sanitised HTML from the markdown source
    bubble.innerHTML = marked.parse(text);
    bubble.querySelectorAll('pre code:not(.hljs)').forEach(function(block) {
      hljs.highlightElement(block);
    });
    scrollToBottom();
  }

  // Create a tool-call indicator row
  function createToolIndicator(toolName, args) {
    var el = document.createElement('div');
    el.className = 'tool-indicator';

    var spinner = document.createElement('div');
    spinner.className = 'spinner';

    var label = document.createElement('span');
    var argsPreview = summariseArgs(args);
    label.textContent = 'Calling ' + toolName + (argsPreview ? ': ' + argsPreview : '') + '...';

    var nameSpan = document.createElement('span');
    nameSpan.className = 'tool-name';
    nameSpan.textContent = toolName;

    // Rebuild as: "Calling <toolName>: args..."
    label.textContent = '';
    label.appendChild(document.createTextNode('Calling '));
    label.appendChild(nameSpan);
    if (argsPreview) {
      label.appendChild(document.createTextNode(': ' + argsPreview + '...'));
    } else {
      label.appendChild(document.createTextNode('...'));
    }

    el.appendChild(spinner);
    el.appendChild(label);
    chat.appendChild(el);
    scrollToBottom();
    return el;
  }

  // Update a tool indicator to show completion
  function markToolDone(el, toolName, summary) {
    // Clear children
    while (el.firstChild) el.removeChild(el.firstChild);

    var icon = document.createElement('span');
    icon.className = 'tool-done-icon';
    icon.textContent = '\u2713';

    var nameSpan = document.createElement('span');
    nameSpan.className = 'tool-name';
    nameSpan.textContent = toolName;

    var label = document.createElement('span');
    label.appendChild(nameSpan);
    label.appendChild(document.createTextNode(' \u2014 ' + truncate(summary, 120)));

    el.appendChild(icon);
    el.appendChild(label);
  }

  // Append an error bubble
  function appendError(message) {
    var outer = document.createElement('div');
    outer.className = 'msg assistant';
    var bubble = document.createElement('div');
    bubble.className = 'error-bubble';
    bubble.textContent = message;
    outer.appendChild(bubble);
    chat.appendChild(outer);
    scrollToBottom();
  }

  // ---------------------------------------------------------------------------
  // Main send function
  // ---------------------------------------------------------------------------
  function sendMessage() {
    var text = inputEl.value.trim();
    if (!text || isStreaming) return;

    var repoPath = selectedRepoPath || '.';

    messages.push({ role: 'user', content: text });
    appendUserMessage(text);

    inputEl.value = '';
    inputEl.style.height = 'auto';

    setInputEnabled(false);
    setStatus('loading', 'Thinking...');
    userScrolledUp = false;

    currentBubble = createAssistantBubble();
    currentText = '';

    // tool-indicator tracking: array of {el, tool, done}
    var toolIndicators = [];

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages, repo_path: repoPath }),
    }).then(function(response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status + ': ' + response.statusText);
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var currentEvent = null;

      function readChunk() {
        return reader.read().then(function(result) {
          if (result.done) {
            finalise();
            return;
          }

          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop();

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (line.indexOf('event: ') === 0) {
              currentEvent = line.slice(7).trim();
            } else if (line.indexOf('data: ') === 0 && currentEvent) {
              var raw = line.slice(6);
              var data;
              try { data = JSON.parse(raw); } catch(_) { currentEvent = null; continue; }
              handleEvent(currentEvent, data);
              currentEvent = null;
            } else if (line === '') {
              currentEvent = null;
            }
          }

          return readChunk();
        });
      }

      return readChunk();
    }).catch(function(err) {
      appendError('Connection error: ' + err.message);
      setStatus('error', 'Error');
      setInputEnabled(true);
    });

    function handleEvent(eventType, data) {
      if (eventType === 'token') {
        if (data && data.content) {
          currentText += data.content;
          renderMarkdown(currentBubble, currentText);
        }
      } else if (eventType === 'tool_call') {
        var toolName = (data && data.tool) || 'tool';
        var args = (data && data.args) || {};
        var indicator = createToolIndicator(toolName, args);
        toolIndicators.push({ el: indicator, tool: toolName, done: false });
        setStatus('loading', 'Using tool: ' + toolName);
        // Re-append the assistant message container so it stays after indicators
        if (currentBubble && currentBubble.parentNode) {
          chat.appendChild(currentBubble.parentNode);
        }
      } else if (eventType === 'tool_result') {
        var toolName = (data && data.tool) || 'tool';
        var summary = (data && data.summary) || '';
        // Mark the oldest pending indicator for this tool as done
        for (var i = 0; i < toolIndicators.length; i++) {
          if (toolIndicators[i].tool === toolName && !toolIndicators[i].done) {
            markToolDone(toolIndicators[i].el, toolName, summary);
            toolIndicators[i].done = true;
            break;
          }
        }
        setStatus('loading', 'Thinking...');
      } else if (eventType === 'error') {
        var msg = (data && data.message) || 'Unknown error';
        appendError(msg);
        setStatus('error', 'Error');
      }
      // 'done' event is handled in finalise()
    }

    function finalise() {
      if (currentText) {
        renderMarkdown(currentBubble, currentText);
        messages.push({ role: 'assistant', content: currentText });
      }
      setInputEnabled(true);
      setStatus('ready', 'Ready');
    }
  }

  // ---------------------------------------------------------------------------
  // Init: fetch status + repos on load
  // ---------------------------------------------------------------------------
  fetch('/api/status').then(function(res) {
    if (res.ok) {
      return res.json().then(function(data) {
        setStatus('ready', data.model_name ? 'Model: ' + data.model_name : 'Ready');
      });
    }
  }).catch(function() {
    setStatus('error', 'Server unavailable');
  });

  fetchRepos();
</script>
</body>
</html>
