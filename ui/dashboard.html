<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>code intelligence</title>
    <script>
      (function () {
        try {
          var k = "cimcp.theme";
          var pref = localStorage.getItem(k) || "system";
          var root = document.documentElement;
          root.classList.remove("theme-light", "theme-dark");
          if (pref === "light") root.classList.add("theme-light");
          else if (pref === "dark") root.classList.add("theme-dark");
        } catch (_) {}
      })();
    </script>
    <style>
      /* WCAG 2.1 AA verified by inspection: 12 px mono ink on bg meets 4.5:1
         in both themes; warn vs bg meets 4.5:1. The 9 px small-caps tracking
         labels carry hierarchy, not content, and are treated as non-text per
         WCAG 1.4.11; they meet 3:1 against bg in both themes. State
         distinctions never rely on color alone (every state has a textual
         label or glyph). */
      :root {
        --bg:        oklch(10% 0.010 250);
        --ink:       oklch(96% 0.008 85);
        --ink-dim:   oklch(72% 0.012 80);
        --label:     oklch(64% 0.014 80);
        --edge:      oklch(28% 0.012 250);
        --edge-soft: oklch(22% 0.010 250);
        --accent:    oklch(82% 0.150 195);
        --warn:      oklch(82% 0.135 55);
        --surface-2: oklch(14% 0.012 250);
        color-scheme: dark;
        --font-serif: "Charter", "Iowan Old Style", "Sitka Text", Georgia, serif;
        --font-mono:  "JetBrains Mono", "Berkeley Mono", "SF Mono", Menlo, ui-monospace, monospace;
        --font-sans:  -apple-system, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root:not(.theme-dark) {
          --bg:        #f4ede1;
          --ink:       #2a241a;
          --ink-dim:   #6d5f3f;
          --label:     #8a7a52;
          --edge:      #d9ccaf;
          --edge-soft: #c9bb9e;
          --accent:    #2f6b5e;
          --warn:      #8a3a1c;
          --surface-2: #e7dec9;
          color-scheme: light;
        }
      }
      :root.theme-light {
        --bg: #f4ede1; --ink: #2a241a; --ink-dim: #6d5f3f; --label: #8a7a52;
        --edge: #d9ccaf; --edge-soft: #c9bb9e; --accent: #2f6b5e; --warn: #8a3a1c; --surface-2: #e7dec9;
        color-scheme: light;
      }
      html, body { background: var(--bg); color: var(--ink); margin: 0; }
      body { font-family: var(--font-mono); font-size: 12px; line-height: 1.5; }
      main { max-width: 1080px; margin: 0 auto; padding: 32px 28px 0; }
      section { margin-bottom: 12px; }
      a { color: inherit; }
      .header { display: flex; align-items: baseline; gap: 18px; padding: 0 0 12px; border-bottom: 1px dashed var(--edge-soft); }
      .header .brand { font-family: var(--font-serif); font-style: italic; font-size: 16px; letter-spacing: 0.01em; }
      .header .crumb { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.02em; }
      .header .grow { flex: 1; }
      .header .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
      .header .pulse.warn { background: transparent; border: 1.5px solid var(--warn); box-shadow: none; }
      .theme-toggle { background: transparent; color: var(--label); border: 1px solid var(--edge); border-radius: 999px; padding: 2px 10px; font: 500 9px var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
      .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .grid { display: grid; grid-template-columns: minmax(0,1fr) 1px minmax(0,1.05fr); padding: 14px 0; }
      .grid .col { padding: 0 18px; min-width: 0; }
      .grid .sep { background: var(--ink); opacity: 0.10; }
      .kv { display: grid; grid-template-columns: 96px 1fr; row-gap: 4px; column-gap: 14px; }
      .kv .k { color: var(--label); }
      .kv .v { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kv .v .ac { color: var(--accent); }
      .kv .v .dim { color: var(--ink-dim); }
      #status-kv.stale .v { color: var(--ink-dim); }
      .bar { display: inline-block; letter-spacing: 0.5px; }
      .bar .fill { color: var(--accent); }
      .bar .gap { color: var(--edge-soft); }
      .tail { font-size: 11px; line-height: 1.55; }
      .tail .ln { display: grid; grid-template-columns: 48px 60px 1fr; gap: 10px; padding: 1px 0; }
      .tail .ln .t { color: var(--label); font-variant-numeric: tabular-nums; }
      .tail .ln .lvl { color: var(--label); text-transform: lowercase; }
      .tail .ln.warn .lvl, .tail .ln.warn { color: var(--warn); }
      .tail .ln.error .lvl, .tail .ln.error { color: var(--warn); font-weight: 600; }
      @media (prefers-reduced-motion: no-preference) {
        .tail .ln.new { animation: fade 120ms ease-out; }
      }
      @keyframes fade { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
      .repos h4 { margin: 18px 0 8px; font: 500 10px var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--label); }
      .repos table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .repos th { text-align: left; font: 500 9px var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--label); padding: 0 8px 6px 0; }
      .repos th.right, .repos td.right { text-align: right; padding-right: 0; }
      .repos td { padding: 4px 8px 4px 0; border-top: 1px dashed var(--edge); cursor: pointer; }
      .repos td .dim { color: var(--ink-dim); margin-left: 8px; }
      .repos tr.detail td { background: var(--surface-2); cursor: default; padding: 8px 12px 12px; border-top: 0; }
      .repos .detail h5 { margin: 0 0 4px; font: 500 9px var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--label); }
      .repos .detail .group + .group { margin-top: 8px; }
      .drop-link { color: var(--warn); cursor: pointer; text-decoration: underline dotted; user-select: none; }
      .drop-link.confirm { color: var(--bg); background: var(--warn); padding: 1px 6px; border-radius: 3px; text-decoration: none; }
      .repos tr[data-id]:focus-visible, .drop-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #palette { position: fixed; inset: 0; display: none; z-index: 50; }
      #palette.open { display: block; }
      #palette .scrim { position: absolute; inset: 0; background: oklch(0% 0 0 / 0.45); }
      #palette .panel { position: absolute; top: 16%; left: 50%; transform: translateX(-50%); width: min(680px, 80vw); max-height: 70vh; display: flex; flex-direction: column; background: var(--surface-2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 1px 0 rgba(0,0,0,0.4), 0 24px 60px rgba(0,0,0,0.6); overflow: hidden; font-family: var(--font-mono); color: var(--ink); }
      #palette .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--edge); }
      #palette .top .caret { color: var(--accent); font-weight: 600; font-size: 13px; }
      #palette .top input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: 13px/1.5 var(--font-mono); }
      #palette .top input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
      #palette .top .esc { font: 500 9px var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--label); border: 1px solid var(--edge); padding: 1px 6px; border-radius: 4px; }
      #palette .body { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
      #palette .section-head { padding: 8px 16px 4px; font: 500 9px var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--label); }
      #palette .row { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: center; padding: 6px 16px; cursor: pointer; font-size: 12px; }
      #palette .row.hl { background: color-mix(in srgb, var(--accent) 14%, transparent); }
      #palette .row .icon { width: 14px; height: 14px; border: 1px solid var(--edge); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--ink-dim); }
      #palette .row.hl .icon { border-color: var(--accent); color: var(--accent); }
      #palette .row .name { color: var(--ink); }
      #palette .row .name .hit { color: var(--accent); font-weight: 600; }
      #palette .row .sub { color: var(--ink-dim); font-size: 10px; margin-left: 6px; }
      #palette .row .badge { font: 500 9px var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); padding: 1px 6px; border: 1px solid var(--edge); border-radius: 3px; }
      #palette .row.hl .badge { border-color: var(--accent); color: var(--accent); }
      #palette .row .badge.warn { color: var(--warn); border-color: var(--warn); }
      #palette .foot { border-top: 1px solid var(--edge); padding: 8px 16px; display: flex; gap: 14px; font: 500 9px var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--label); }
      #palette .foot kbd { font: 500 9px var(--font-sans); padding: 1px 4px; border: 1px solid var(--edge); border-radius: 3px; color: var(--ink); }
      #palette .empty { padding: 16px; color: var(--ink-dim); font-size: 11px; }
      @media (prefers-reduced-motion: no-preference) {
        #palette.open .panel { animation: pal-in 120ms ease-out; }
      }
      @keyframes pal-in { from { opacity: 0; transform: translate(-50%, -2px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
  </head>
  <body data-theme-key="cimcp.theme">
    <main>
      <section id="header-strip" class="header">
        <span class="brand">code intelligence</span>
        <span class="crumb" id="daemon-addr"></span>
        <span class="grow"></span>
        <button id="theme-toggle" class="theme-toggle" aria-label="cycle theme"></button>
        <span id="health-pulse" class="pulse" role="status" aria-label="daemon healthy" title="daemon healthy"></span>
      </section>
      <section id="status-grid" class="grid">
        <div class="col">
          <div class="kv" id="status-kv"></div>
        </div>
        <div class="sep"></div>
        <div class="col" id="tail-col"></div>
      </section>
      <section id="repo-table" class="repos">
        <h4>Repositories</h4>
        <table>
          <thead>
            <tr>
              <th>name</th>
              <th class="right">last access</th>
              <th class="right">activity</th>
            </tr>
          </thead>
          <tbody id="repo-rows"></tbody>
        </table>
      </section>
    </main>
    <script type="module">
      const $ = (sel) => document.querySelector(sel);

      function el(tag, props, ...children) {
        const n = document.createElement(tag);
        if (props) {
          for (const k in props) {
            const v = props[k];
            if (v == null) continue;
            if (k === "class") n.className = v;
            else if (k === "text") n.textContent = v;
            else if (k === "on") for (const ev in v) n.addEventListener(ev, v[ev]);
            else if (k in n) n[k] = v;
            else n.setAttribute(k, v);
          }
        }
        for (const c of children) {
          if (c == null) continue;
          n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
        }
        return n;
      }

      const fetchJson = async (path) => {
        const res = await fetch(path, { headers: { accept: "application/json" } });
        if (!res.ok) throw new Error(`${path} ${res.status}`);
        return res.json();
      };

      async function renderHeader() {
        const pulse = $("#health-pulse");
        try {
          const [status, version] = await Promise.all([fetchJson("/api/status"), fetchJson("/api/version")]);
          const healthy = status.healthy !== false;
          pulse.classList.toggle("warn", !healthy);
          const label = `daemon ${healthy ? "healthy" : "degraded"}`;
          pulse.setAttribute("aria-label", label);
          pulse.title = `${label} · ${version.version || "unknown"}`;
          const addr = status.host && status.port ? `${status.host}:${status.port}` : `localhost:${location.port || 17800}`;
          $("#daemon-addr").textContent = addr;
        } catch (_) {
          pulse.classList.add("warn");
          pulse.setAttribute("aria-label", "daemon unreachable");
          $("#daemon-addr").textContent = "unreachable";
        }
      }
      renderHeader();
      setInterval(renderHeader, 5000);

      function fmtUptime(seconds) {
        if (!Number.isFinite(seconds)) return "–";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        return `${h}h ${m}m`;
      }
      function basename(p) {
        const parts = (p || "").split("/").filter(Boolean);
        return parts[parts.length - 1] || p || "";
      }
      function bar(pct) {
        const filled = Math.round(Math.max(0, Math.min(1, pct)) * 10);
        return el("span", { class: "bar" },
          el("span", { class: "fill", text: "▮".repeat(filled) }),
          el("span", { class: "gap",  text: "▯".repeat(10 - filled) }),
          ` ${Math.round(pct * 100)}%`
        );
      }
      function kvRow(key, value) {
        return [
          el("span", { class: "k", text: key }),
          el("span", { class: "v" }, value),
        ];
      }

      async function renderStatus() {
        const kv = $("#status-kv");
        try {
          const [status, repos, sessions, jobs, version] = await Promise.all([
            fetchJson("/api/status"),
            fetchJson("/api/repos"),
            fetchJson("/api/sessions"),
            fetchJson("/api/jobs"),
            fetchJson("/api/version"),
          ]);
          const repoList = repos.repos ?? [];
          const sessionList = sessions.sessions ?? [];
          const jobList = jobs.jobs ?? [];
          const totalSymbols = repoList.reduce((a, r) => a + (r.symbol_count || 0), 0);
          const sessionNames = sessionList.map((s) => basename(s.repo) || s.client || s.session_id || s.id || "session");
          const running = jobList.filter((j) => j.status === "running");
          const runPct = running[0]?.progress ?? 0;
          const ok = status.healthy !== false;
          const uptime = status.uptime_s ?? status.uptime_seconds;

          const daemonV = el("span", null,
            el("span", { class: "ac", text: ok ? "ok" : "degraded" }),
            ` · up ${fmtUptime(uptime)}`
          );
          const reposV = totalSymbols > 0
            ? `${repoList.length} indexed · ${totalSymbols.toLocaleString()} symbols`
            : `${repoList.length} indexed`;
          const sessV  = el("span", null,
            `${sessionNames.length} · `,
            el("span", { class: "dim", text: sessionNames.slice(0, 3).join(", ") || "none" })
          );
          const jobsV  = el("span", null, `${running.length} running  `, bar(runPct));
          const embedV = el("span", { class: "dim", text: "telemetry not exposed yet" });
          const verV   = `${version.version || "unknown"} · llama.cpp metal`;

          kv.classList.remove("stale");
          kv.replaceChildren(
            ...kvRow("daemon",   daemonV),
            ...kvRow("repos",    reposV),
            ...kvRow("sessions", sessV),
            ...kvRow("jobs",     jobsV),
            ...kvRow("embed",    embedV),
            ...kvRow("version",  verV),
          );
        } catch (_) {
          kv.classList.add("stale");
        }
      }
      renderStatus();
      setInterval(renderStatus, 5000);

      const THEME_KEY = "cimcp.theme";
      const THEMES = ["system", "light", "dark"];
      function applyTheme(pref) {
        const root = document.documentElement;
        root.classList.remove("theme-light", "theme-dark");
        if (pref === "light") root.classList.add("theme-light");
        else if (pref === "dark") root.classList.add("theme-dark");
        $("#theme-toggle").textContent = pref;
      }
      $("#theme-toggle").addEventListener("click", () => {
        const cur = localStorage.getItem(THEME_KEY) || "system";
        const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });
      applyTheme(localStorage.getItem(THEME_KEY) || "system");

      $("#tail-col").appendChild(
        el("div", {
          class: "tail",
          id: "tail",
          role: "log",
          "aria-live": "polite",
          "aria-relevant": "additions",
          "aria-label": "live log tail",
        })
      );

      const MAX_TAIL = 6;
      let tailLines = [];
      const tailFilter = { since_ms: null, grep: null };
      let logSource = null;

      function fmtTs(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "";
        return d.toTimeString().slice(0, 5);
      }

      function fmtAgo(iso) {
        if (!iso) return "–";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "–";
        const ms = Date.now() - d.getTime();
        if (ms < 60_000) return "just now";
        if (ms < 3_600_000) return `${Math.floor(ms / 60_000)}m ago`;
        if (ms < 86_400_000) return `${Math.floor(ms / 3_600_000)}h ago`;
        if (ms < 7 * 86_400_000) return `${Math.floor(ms / 86_400_000)}d ago`;
        return d.toISOString().slice(0, 10);
      }

      function lineMatchesFilter(l) {
        if (tailFilter.grep && !String(l.message).toLowerCase().includes(tailFilter.grep.toLowerCase())) return false;
        if (tailFilter.since_ms && l.received_at && Date.now() - l.received_at > tailFilter.since_ms) return false;
        return true;
      }

      function pushTailLine(entry) {
        const stamped = { ...entry, received_at: Date.now() };
        tailLines.push(stamped);
        if (tailLines.length > 200) tailLines = tailLines.slice(-200);
        renderTail();
      }

      function renderTail() {
        const tail = $("#tail");
        const rows = tailLines
          .slice(-MAX_TAIL)
          .filter(lineMatchesFilter)
          .reverse()
          .map((l, i) =>
            el("div", { class: `ln ${l.level}${i === 0 ? " new" : ""}` },
              el("span", { class: "t",   text: l.ts }),
              el("span", { class: "lvl", text: l.level }),
              el("span", { class: "msg", text: l.message })
            )
          );
        tail.replaceChildren(...rows);
      }

      function parseTextLogLine(raw) {
        // Tracing default format: "<ISO timestamp>  <LEVEL>  <rest>"
        // Two spaces separate timestamp from level; one or more separate level from rest.
        const re = /^(\S+)\s+(TRACE|DEBUG|INFO|WARN|ERROR)\s+(.*)$/;
        const m = raw.match(re);
        if (!m) return { ts: fmtTs(Date.now()), level: "info", message: raw };
        return {
          ts: fmtTs(m[1]),
          level: m[2].toLowerCase() === "warn" ? "warn" :
                 m[2].toLowerCase() === "error" ? "error" : "info",
          message: m[3],
        };
      }

      function startTail() {
        logSource = new EventSource("/api/logs/stream");
        logSource.onmessage = (ev) => {
          let entry = null;
          try {
            const obj = JSON.parse(ev.data);
            if (obj && typeof obj === "object" && !Array.isArray(obj)) {
              entry = {
                ts: fmtTs(obj.timestamp || obj.ts || Date.now()),
                level: String(obj.level || "info").toLowerCase(),
                message: String(obj.message || obj.msg || ev.data),
              };
            } else {
              entry = parseTextLogLine(ev.data);
            }
          } catch (_) {
            entry = parseTextLogLine(ev.data);
          }
          pushTailLine(entry);
        };
        logSource.addEventListener("lagged", (ev) => {
          pushTailLine({
            ts: fmtTs(Date.now()),
            level: "warn",
            message: `[stream] lagged ${ev.data || "n/a"} entries`,
          });
        });
        logSource.onerror = () => {
          if (logSource.readyState === EventSource.CLOSED) setTimeout(startTail, 2000);
        };
      }
      startTail();

      let expandedRepoId = null;
      const repoDetailCache = new Map();
      let lastRepoList = [];
      let lastSessions = [];
      let pendingDrop = null; // { id: string, expiresAt: number (ms epoch) }
      let attachToken = 0;

      function activityLabel(r) {
        if (r.activity?.running) return "running";
        if (r.activity?.last_finished) return "idle";
        return "never";
      }

      function renderRepoRow(r) {
        const last = fmtAgo(r.last_accessed);
        const nameCell = el("td", null,
          r.name || basename(r.path),
          el("span", { class: "dim", text: r.path || "" })
        );
        const tr = el("tr", { tabindex: 0, role: "button", "aria-expanded": String(expandedRepoId === r.id) },
          nameCell,
          el("td", { class: "right", text: last }),
          el("td", { class: "right", text: activityLabel(r) })
        );
        tr.dataset.id = r.id;
        return tr;
      }

      function renderRepoDetail(detail, repoId, sessions) {
        const stats = detail.stats || {};
        const statsRow = (k, v) =>
          el("div", { class: "kv-line" },
            el("span", { class: "k", style: "color:var(--label);font:500 9px var(--font-sans);letter-spacing:0.16em;text-transform:uppercase;margin-right:10px", text: k }),
            el("span", { class: "v", text: v == null ? "–" : String(v.toLocaleString?.() ?? v) })
          );

        const statsGroup = el("div", { class: "group" },
          el("h5", { text: "stats" }),
          statsRow("symbols", stats.symbols),
          statsRow("edges", stats.edges),
          statsRow("descriptions", stats.descriptions),
          statsRow("undescribed", stats.undescribed_symbols),
        );

        const repoPath = detail.path || "";
        const boundSessions = (sessions || []).filter((s) => s.repo === repoPath);
        const sessionsList = boundSessions.length === 0
          ? el("span", { class: "dim", style: "color:var(--ink-dim)", text: "none" })
          : el("span", { text: boundSessions.map((s) => (s.session_id || "").slice(0, 8)).join(", ") });
        const sessionsGroup = el("div", { class: "group" },
          el("h5", { text: "bound sessions" }),
          sessionsList,
        );

        const dropLink = el("a", { href: "#", class: "drop-link", text: "drop repo" });
        dropLink.dataset.action = "drop";
        dropLink.dataset.id = repoId;
        if (pendingDrop && pendingDrop.id === repoId && Date.now() < pendingDrop.expiresAt) {
          dropLink.textContent = "confirm drop";
          dropLink.classList.add("confirm");
        }
        const actionsGroup = el("div", { class: "group" },
          el("h5", { text: "actions" }),
          el("div", null, dropLink),
        );

        const detailDiv = el("div", { class: "detail" }, statsGroup, sessionsGroup, actionsGroup);
        return el("tr", { class: "detail" }, el("td", { colSpan: 3 }, detailDiv));
      }

      async function renderRepos() {
        if (pendingDrop && Date.now() < pendingDrop.expiresAt) return;
        let data;
        try { data = await fetchJson("/api/repos"); }
        catch (_) { return; }
        const list = data.repos ?? [];
        lastRepoList = list;
        const tbody = $("#repo-rows");
        tbody.replaceChildren(...list.map(renderRepoRow));
        if (expandedRepoId) {
          const present = list.find((r) => r.id === expandedRepoId);
          if (present) attachDetail(expandedRepoId); else expandedRepoId = null;
        }
      }

      async function attachDetail(id) {
        const myToken = ++attachToken;
        document.querySelectorAll("tr.detail").forEach((tr) => tr.remove());
        document.querySelectorAll("tr[data-id]").forEach((tr) => tr.setAttribute("aria-expanded", tr.dataset.id === id ? "true" : "false"));
        const cached = repoDetailCache.get(id);
        let detail;
        try {
          detail = cached && Date.now() - cached.fetchedAt < 5000
            ? cached.data
            : await fetchJson(`/api/repos/${encodeURIComponent(id)}`);
        } catch (_) {
          return;
        }
        if (myToken !== attachToken) return;
        repoDetailCache.set(id, { fetchedAt: Date.now(), data: detail });
        let sessions = lastSessions;
        try {
          const s = await fetchJson("/api/sessions");
          sessions = s.sessions ?? [];
          lastSessions = sessions;
        } catch (_) { /* keep last */ }
        if (myToken !== attachToken) return;
        const host = document.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
        if (!host) return;
        host.insertAdjacentElement("afterend", renderRepoDetail(detail, id, sessions));
      }

      async function toggleExpand(id) {
        if (expandedRepoId === id) {
          expandedRepoId = null;
          document.querySelectorAll("tr.detail").forEach((tr) => tr.remove());
          document.querySelectorAll("tr[data-id]").forEach((tr) => tr.setAttribute("aria-expanded", "false"));
          return;
        }
        expandedRepoId = id;
        await attachDetail(id);
      }

      $("#repo-rows").addEventListener("click", async (ev) => {
        const link = ev.target.closest(".drop-link");
        if (link) {
          ev.preventDefault();
          if (link.classList.contains("confirm")) {
            const id = link.dataset.id;
            pendingDrop = null;
            try {
              await fetch(`/api/repos/${encodeURIComponent(id)}`, { method: "DELETE", headers: { accept: "application/json" } });
            } catch (_) { /* swallow; the next renderRepos cycle will reflect actual state */ }
            expandedRepoId = null;
            repoDetailCache.delete(id);
            renderRepos();
            return;
          }
          pendingDrop = { id: link.dataset.id, expiresAt: Date.now() + 5000 };
          link.textContent = "confirm drop";
          link.classList.add("confirm");
          setTimeout(() => {
            if (pendingDrop && pendingDrop.id === link.dataset.id) pendingDrop = null;
            if (link.isConnected) {
              link.textContent = "drop repo";
              link.classList.remove("confirm");
            }
          }, 5000);
          return;
        }
        const tr = ev.target.closest("tr[data-id]");
        if (tr) toggleExpand(tr.dataset.id);
      });

      $("#repo-rows").addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        const tr = ev.target.closest("tr[data-id]");
        if (!tr) return;
        ev.preventDefault();
        toggleExpand(tr.dataset.id);
      });

      renderRepos();
      setInterval(renderRepos, 5000);

      const palette = $("#palette");
      const paletteInput = $("#palette-input");
      const paletteFoot = $("#palette-foot");
      let paletteOpen = false;
      let lastFocus = null;

      function openPalette() {
        if (paletteOpen) return;
        paletteOpen = true;
        lastFocus = document.activeElement;
        palette.classList.add("open");
        palette.setAttribute("aria-hidden", "false");
        paletteInput.value = "";
        paletteInput.focus();
        renderPalette();
      }

      function closePalette() {
        if (!paletteOpen) return;
        paletteOpen = false;
        palette.classList.remove("open");
        palette.setAttribute("aria-hidden", "true");
        paletteInput.blur();
        if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
      }

      function fuzzyMatch(query, label) {
        const q = query.trim().toLowerCase();
        const s = label.toLowerCase();
        if (q.length === 0) return { ok: true, hits: [] };
        const tokens = q.split(/\s+/);
        const hits = [];
        for (const tok of tokens) {
          const idx = s.indexOf(tok);
          if (idx < 0) return { ok: false };
          hits.push([idx, idx + tok.length]);
        }
        hits.sort((a, b) => a[0] - b[0]);
        return { ok: true, hits };
      }

      function highlightLabel(label, hits) {
        if (!hits || hits.length === 0) return [label];
        const merged = [];
        for (const [a, b] of hits) {
          if (merged.length && merged[merged.length - 1][1] >= a) {
            merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], b);
          } else merged.push([a, b]);
        }
        const out = [];
        let cursor = 0;
        for (const [a, b] of merged) {
          if (a > cursor) out.push(label.slice(cursor, a));
          out.push(el("span", { class: "hit", text: label.slice(a, b) }));
          cursor = b;
        }
        if (cursor < label.length) out.push(label.slice(cursor));
        return out;
      }

      function paletteRow(kind, primary, secondary, query, defaultBadge) {
        const match = fuzzyMatch(query, primary);
        if (!match.ok) return null;
        const nameSpan = el("span", { class: "name" }, ...highlightLabel(primary, match.hits));
        if (secondary) nameSpan.appendChild(el("span", { class: "sub", text: secondary }));
        const row = el("div", { class: "row", role: "option", tabindex: -1 },
          el("span", { class: "icon", text: kind === "repo" ? "▣" : kind === "session" ? "●" : "▸" }),
          nameSpan,
          el("span", { class: "badge", text: defaultBadge || "↵" }),
        );
        row.dataset.kind = kind;
        return row;
      }

      let paletteHighlight = 0;
      let lastMouseX = -1;
      let lastMouseY = -1;

      function paletteRowsFlat() {
        return [...palette.querySelectorAll(".body .row")];
      }

      function setHighlight(i) {
        const rows = paletteRowsFlat();
        if (rows.length === 0) { paletteHighlight = 0; renderPaletteFoot(null); return; }
        paletteHighlight = (i + rows.length) % rows.length;
        rows.forEach((r, k) => r.classList.toggle("hl", k === paletteHighlight));
        rows[paletteHighlight].scrollIntoView({ block: "nearest" });
        renderPaletteFoot(rows[paletteHighlight]);
      }

      let reindexAllPending = null; // { expiresAt }

      function confirmReindexAll() {
        if (reindexAllPending && Date.now() < reindexAllPending.expiresAt) {
          reindexAllPending = null;
          (async () => {
            for (const r of lastRepoList || []) {
              try { await fetch(`/api/repos/${encodeURIComponent(r.id)}/reindex`, { method: "POST", headers: { accept: "application/json" } }); }
              catch (_) { /* swallow; the next renderRepos cycle reflects actual state */ }
            }
          })();
          return;
        }
        reindexAllPending = { expiresAt: Date.now() + 5000 };
        alert(`Reindex all (${(lastRepoList || []).length}) repos? Run again within 5s to confirm.`);
      }

      function cyclePaletteTheme() {
        $("#theme-toggle").click();
      }

      function clearTailFilter() {
        tailFilter.grep = null;
        tailFilter.since_ms = null;
        renderTail();
      }

      // `openTailFilterMode` is implemented in Task 4. Stub for now so PALETTE_ACTIONS
      // initialises cleanly; Task 4 replaces the body.
      function openTailFilterMode() { /* Task 4 */ }

      const PALETTE_ACTIONS = [
        { id: "refresh",     label: "Refresh data now",         run: () => { renderHeader(); renderStatus(); renderRepos(); } },
        { id: "reindex-all", label: "Reindex all repositories", run: confirmReindexAll },
        { id: "cycle-theme", label: "Cycle theme",              run: cyclePaletteTheme },
        { id: "filter-tail", label: "Filter live tail…",        run: openTailFilterMode, keepOpen: true },
        { id: "clear-tail",  label: "Clear live tail filter",   run: clearTailFilter },
      ];

      function renderPalette() {
        lastMouseX = -1;
        lastMouseY = -1;
        const q = paletteInput.value;

        const repoHost = palette.querySelector('[data-palette-results="repos"]');
        const repoRows = [];
        for (const r of lastRepoList || []) {
          const row = paletteRow("repo", r.name || basename(r.path), r.path || "", q);
          if (!row) continue;
          row.dataset.repoId = r.id;
          row.dataset.repoName = r.name || basename(r.path);
          repoRows.push(row);
        }
        repoHost.replaceChildren(...repoRows);
        palette.querySelector('[data-palette-section="repos"]').style.display = repoRows.length ? "" : "none";

        const sessionHost = palette.querySelector('[data-palette-results="sessions"]');
        const sessionRows = [];
        for (const s of lastSessions || []) {
          const primary = (s.repo ? basename(s.repo) : null) || (s.session_id || "").slice(0, 8) || "session";
          const sub = s.bound ? "bound" : "connected";
          const row = paletteRow("session", primary, sub, q);
          if (!row) continue;
          row.dataset.sessionId = s.session_id || "";
          sessionRows.push(row);
        }
        sessionHost.replaceChildren(...sessionRows);
        palette.querySelector('[data-palette-section="sessions"]').style.display = sessionRows.length ? "" : "none";

        const actionsHost = palette.querySelector('[data-palette-results="actions"]');
        const actionRows = [];
        for (const a of PALETTE_ACTIONS) {
          const row = paletteRow("action", a.label, "", q);
          if (!row) continue;
          row.dataset.actionId = a.id;
          actionRows.push(row);
        }
        actionsHost.replaceChildren(...actionRows);
        palette.querySelector('[data-palette-section="actions"]').style.display = actionRows.length ? "" : "none";

        setHighlight(0);
      }

      paletteInput.addEventListener("input", renderPalette);

      function renderPaletteFoot(row) {
        const kind = row?.dataset?.kind;
        const items = [
          el("span", null, el("kbd", { text: "↑ ↓" }), " nav"),
          el("span", null, el("kbd", { text: "↵" }), " run"),
        ];
        if (kind === "repo") {
          items.push(el("span", null, el("kbd", { text: "⌘↵" }), " reindex"));
          items.push(el("span", null, el("kbd", { text: "⌘⌫" }), " drop"));
        }
        items.push(el("span", null, el("kbd", { text: "esc" }), " close"));
        paletteFoot.replaceChildren(...items);
      }

      function executePaletteRow(row, opts) {
        const kind = row.dataset.kind;
        if (kind === "repo") {
          const id = row.dataset.repoId;
          if (!id) return;
          closePalette();
          toggleExpand(id);
          document.querySelector(`tr[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
        } else if (kind === "session") {
          closePalette();
          document.querySelector("#status-grid")?.scrollIntoView({ behavior: "smooth", block: "start" });
        } else if (kind === "action") {
          const action = PALETTE_ACTIONS.find((a) => a.id === row.dataset.actionId);
          if (!action) return;
          if (!action.keepOpen) closePalette();
          action.run();
        }
      }

      paletteInput.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) {
          ev.preventDefault();
          const rows = paletteRowsFlat();
          const row = rows[paletteHighlight];
          if (row && row.dataset.kind === "repo") {
            const id = row.dataset.repoId;
            fetch(`/api/repos/${encodeURIComponent(id)}/reindex`, { method: "POST", headers: { accept: "application/json" } });
            closePalette();
          }
          return;
        }
        if (ev.key === "Backspace" && (ev.metaKey || ev.ctrlKey)) {
          const rows = paletteRowsFlat();
          const row = rows[paletteHighlight];
          if (!row || row.dataset.kind !== "repo") return;
          ev.preventDefault();
          const id = row.dataset.repoId;
          if (pendingDrop && pendingDrop.id === id && Date.now() < pendingDrop.expiresAt) {
            pendingDrop = null;
            fetch(`/api/repos/${encodeURIComponent(id)}`, { method: "DELETE", headers: { accept: "application/json" } });
            expandedRepoId = null;
            repoDetailCache.delete(id);
            renderRepos();
            closePalette();
            return;
          }
          pendingDrop = { id, expiresAt: Date.now() + 5000 };
          const badge = row.querySelector(".badge");
          if (badge) { badge.textContent = "confirm drop"; badge.classList.add("warn"); }
          setTimeout(() => {
            if (pendingDrop && pendingDrop.id === id) pendingDrop = null;
            if (badge && badge.isConnected) { badge.textContent = "↵"; badge.classList.remove("warn"); }
          }, 5000);
          return;
        }
        if (ev.key === "ArrowDown") { ev.preventDefault(); setHighlight(paletteHighlight + 1); }
        else if (ev.key === "ArrowUp") { ev.preventDefault(); setHighlight(paletteHighlight - 1); }
        else if (ev.key === "Enter") {
          ev.preventDefault();
          const rows = paletteRowsFlat();
          const row = rows[paletteHighlight];
          if (row) executePaletteRow(row, { primary: true });
        }
      });

      document.addEventListener("keydown", (ev) => {
        const isCmdK = (ev.metaKey || ev.ctrlKey) && (ev.key === "k" || ev.key === "K");
        if (isCmdK) {
          ev.preventDefault();
          openPalette();
          return;
        }
        if (ev.key === "Escape" && paletteOpen) {
          ev.preventDefault();
          closePalette();
        }
      });

      palette.addEventListener("mousemove", (ev) => {
        if (ev.clientX === lastMouseX && ev.clientY === lastMouseY) return;
        lastMouseX = ev.clientX;
        lastMouseY = ev.clientY;
        const row = ev.target.closest(".row");
        if (!row) return;
        const rows = paletteRowsFlat();
        const i = rows.indexOf(row);
        if (i >= 0) setHighlight(i);
      });

      palette.addEventListener("click", (ev) => {
        if (ev.target.dataset?.action === "close") { closePalette(); return; }
        const row = ev.target.closest(".row");
        if (row) executePaletteRow(row, { primary: true });
      });
    </script>
    <section id="palette" role="dialog" aria-modal="true" aria-label="command palette" aria-hidden="true">
      <div class="scrim" data-action="close"></div>
      <div class="panel" role="document">
        <div class="top">
          <span class="caret" aria-hidden="true">›</span>
          <input id="palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="search repos, sessions, actions" aria-label="search" />
          <span class="esc">esc</span>
        </div>
        <div class="body">
          <div class="section-head" data-palette-section="repos">Repositories</div>
          <div data-palette-results="repos"></div>
          <div class="section-head" data-palette-section="sessions">Sessions</div>
          <div data-palette-results="sessions"></div>
          <div class="section-head" data-palette-section="actions">Actions</div>
          <div data-palette-results="actions"></div>
        </div>
        <div class="foot" id="palette-foot"></div>
      </div>
    </section>
  </body>
</html>
